name: 포스트 재작성 (기존 글 업데이트 · 이미지+상품카드+광고문구)

# 초안(md)으로 기존 글(post_id)을 통째로 다시 빌드해 업데이트한다.
# SVG 인포그래픽 + [[PRODUCT:key]] 상품카드 + AI 썸네일/핵심사진 + 상단 광고표시 문구(스타일).
# post_id를 비우면 새 글로 발행.

on:
  workflow_dispatch:
    inputs:
      post_id: { description: '업데이트할 글 번호(ID). 비우면 새 글 발행', required: false }
      draft_path: { description: '초안 md 경로', required: true }
      image_dir: { description: 'SVG 인포그래픽 폴더', required: false, default: 'assets/images' }
      product_dir: { description: '[[PRODUCT:key]] 상품 HTML 폴더', required: false, default: 'assets/products' }
      category_name: { description: '카테고리 이름', required: false }
      category_slug: { description: '카테고리 슬러그 (새로 만들 때만)', required: false }
      img_slug: { description: '이미지 슬러그. drafts/img/<슬러그>-thumb.png · -body.png 를 쓴다 (권장)', required: false, default: '' }
      allow_ai_images: { description: 'AI 이미지 생성 허용 (y/n). 기본 n — 운영자 허락 없이 OpenAI 호출 금지', required: false, default: 'n' }
      thumb_prompt: { description: '[AI 전용] 썸네일 프롬프트. allow_ai_images=y 일 때만 쓴다', required: false, default: '' }
      thumb_alt: { description: '썸네일 alt', required: false, default: '대표 이미지' }
      mid_prompt: { description: '[AI 전용] 핵심사진 프롬프트. allow_ai_images=y 일 때만 쓴다', required: false, default: '' }
      mid_alt: { description: '핵심사진 alt', required: false, default: '본문 이미지' }
      mid_anchor: { description: '핵심사진을 넣을 소제목(h2)', required: true }
      disclosure_font: { description: '광고표시 문구 글씨 크기(px)', required: false, default: '13' }
      status: { description: 'publish / draft', required: false, default: 'publish' }
      publish_at: { description: '예약발행 시각(사이트 현지=KST 기준 ISO, 예: 2026-09-10T09:00:00). 넣으면 그 시각에 자동 발행(status=future)', required: false, default: '' }
      skip_gate: { description: '발행 전 검사 건너뛰기 (y/n) — 이유가 있을 때만', required: false, default: 'n' }
      slug: { description: '슬러그(넣으면 발행 직후 적용). 새 글은 한글=포커스 키워드(예: 강아지-귀-청소), 에셋 키는 영문 유지. 저장값 echo 확인', required: false, default: '' }
      tags: { description: '태그(콤마 구분). 넣으면 발행 직후 바로 적용', required: false, default: '' }
      seo_description: { description: '검색 스니펫 문구. 넣으면 발행 직후 excerpt 로 저장', required: false, default: '' }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 규칙을 문서에만 두면 지켜지지 않는다. 발행 경로에 검사를 물려 못 지나가게 한다.
      # 컴플라이언스(광고표시·금지어) + AI 티(번역투·대구·쉼표) 둘 다 본다.
      - name: 발행 전 검사
        env:
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
          SKIP_GATE: ${{ github.event.inputs.skip_gate }}
        run: |
          if [ "${SKIP_GATE:0:1}" = "y" ] || [ "${SKIP_GATE:0:1}" = "Y" ]; then
            echo "::warning::발행 전 검사를 건너뜁니다 (skip_gate=y)"; exit 0
          fi
          fail=0
          python3 tools/compliance.py "$DRAFT_PATH" || fail=1
          python3 tools/humanize.py  "$DRAFT_PATH" --gate || fail=1
          if [ "$fail" != "0" ]; then
            echo "::error::발행 전 검사에서 막혔습니다. 초안을 고치거나, 이유가 있으면 skip_gate=y로 다시 실행하세요."
            exit 1
          fi
      # 2026-08-19: apt 가 세 번 연속 이 자리에서 멈췄다(7분+ 무한 대기).
      # 미러가 응답을 안 하면 apt 기본 타임아웃이 매우 길어 잡이 통째로 걸린다.
      #
      # 인포그래픽 SVG 에 한글이 들어가므로 CJK 폰트가 없으면 전부 네모로 깨진다.
      # 그래서 apt 가 실패해도 폰트만은 반드시 확보해야 한다 —
      # Google Fonts 저장소에서 Noto Sans KR 을 직접 받아 fontconfig 에 등록한다.
      # 폰트가 끝내 없으면 깨진 이미지를 발행하느니 여기서 멈춘다.
      - name: 변환기 (apt, 실패해도 계속)
        timeout-minutes: 3
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
            -o Acquire::Retries=1 || echo "::warning::apt-get update 실패"
          sudo apt-get install -y -qq \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
            -o Acquire::Retries=1 \
            librsvg2-bin fonts-noto-cjk || echo "::warning::apt 설치 실패 — 대체 경로로 간다"

      - name: 한글 폰트 확보
        run: |
          have_cjk() { fc-list 2>/dev/null | grep -qiE "noto sans (cjk|kr)|nanum"; }
          if have_cjk; then
            echo "CJK 폰트 있음 (apt 로 설치됨)"
          else
            echo "::warning::CJK 폰트 없음 — Noto Sans KR 을 직접 받는다"
            mkdir -p ~/.fonts
            for u in \
              "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" ; do
              curl -fsSL --max-time 60 "$u" -o ~/.fonts/NotoSansKR.ttf && break
            done
            fc-cache -f >/dev/null 2>&1 || true
          fi
          echo "--- 설치된 한글 폰트 ---"
          fc-list 2>/dev/null | grep -iE "noto sans (cjk|kr)|nanum" | head -3
          if ! have_cjk; then
            echo "::error::한글 폰트를 확보하지 못했습니다. 인포그래픽이 네모로 깨진 채 발행되므로 여기서 멈춥니다."
            exit 1
          fi

      - name: SVG → PNG
        env:
          IMAGE_DIR: ${{ github.event.inputs.image_dir }}
        run: |
          DIR="${IMAGE_DIR:-assets/images}"; mkdir -p /tmp/png
          if command -v rsvg-convert >/dev/null 2>&1; then
            echo "변환기: rsvg-convert"
            for f in "$DIR"/*.svg; do
              [ -e "$f" ] || continue
              rsvg-convert "$f" -o "/tmp/png/$(basename "$f" .svg).png"
            done
          else
            echo "::warning::rsvg-convert 없음 — cairosvg 로 변환한다"
            pip -q install cairosvg
            python3 - <<'PYCONV'
          import glob, os, pathlib, cairosvg
          d = os.environ.get("IMAGE_DIR") or "assets/images"
          for f in sorted(glob.glob(os.path.join(d, "*.svg"))):
              out = "/tmp/png/" + pathlib.Path(f).stem + ".png"
              cairosvg.svg2png(url=f, write_to=out, output_width=1000)
              print("변환:", f, "→", out)
          PYCONV
          fi
          ls -la /tmp/png || true

      - name: 빌드 + 업데이트
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
          IMAGE_DIR: ${{ github.event.inputs.image_dir }}
          PRODUCT_DIR: ${{ github.event.inputs.product_dir }}
          CATEGORY_NAME: ${{ github.event.inputs.category_name }}
          CATEGORY_SLUG: ${{ github.event.inputs.category_slug }}
          IMG_SLUG: ${{ github.event.inputs.img_slug }}
          ALLOW_AI_IMAGES: ${{ github.event.inputs.allow_ai_images }}
          THUMB_PROMPT: ${{ github.event.inputs.thumb_prompt }}
          THUMB_ALT: ${{ github.event.inputs.thumb_alt }}
          MID_PROMPT: ${{ github.event.inputs.mid_prompt }}
          MID_ALT: ${{ github.event.inputs.mid_alt }}
          MID_ANCHOR: ${{ github.event.inputs.mid_anchor }}
          DISCLOSURE_FONT: ${{ github.event.inputs.disclosure_font }}
          POST_STATUS: ${{ github.event.inputs.status }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at }}
        run: |
          pip -q install markdown requests
          python3 - <<'PY'
          import os, re, glob, json, base64, requests, markdown
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          oai = (os.environ.get("OPENAI_KEY") or "").strip()
          image_dir = (os.environ.get("IMAGE_DIR") or "assets/images").strip()
          product_dir = (os.environ.get("PRODUCT_DIR") or "assets/products").strip()

          def up(data, alt, fname):
              r = requests.post(f"{base}/wp-json/wp/v2/media",
                  headers={"Content-Type": "image/png", "Content-Disposition": f'attachment; filename="{fname}"'},
                  data=data, auth=auth, timeout=120)
              if not r.ok:
                  print(f"::error::미디어 업로드 실패 {r.status_code}: {r.text[:300]}"); raise SystemExit(1)
              m = r.json()
              requests.post(f"{base}/wp-json/wp/v2/media/{m['id']}", json={"alt_text": alt}, auth=auth, timeout=30)
              return m["id"], m["source_url"]

          def fig(url, alt):
              return f'<figure style="text-align:center;margin:1.5em 0"><img src="{url}" alt="{alt}" style="max-width:100%;height:auto;border-radius:10px"/></figure>\n'

          def genai(prompt):
              for body in [
                  {"model": "gpt-image-1", "prompt": prompt, "size": "1536x1024", "n": 1},
                  {"model": "dall-e-3", "prompt": prompt, "size": "1792x1024", "n": 1, "response_format": "b64_json"},
              ]:
                  r = requests.post("https://api.openai.com/v1/images/generations",
                      headers={"Authorization": f"Bearer {oai}", "Content-Type": "application/json"}, json=body, timeout=180)
                  if r.ok:
                      print(f"{body['model']} 생성 성공"); return base64.b64decode(r.json()["data"][0]["b64_json"])
                  print(f"{body['model']} 실패 {r.status_code}: {r.text[:200]}")
              raise SystemExit("::error::AI 이미지 생성 실패")

          # 1) 인포그래픽 업로드
          ALT = {}
          try: ALT = json.load(open(os.path.join(image_dir, "alt.json"), encoding="utf-8"))
          except Exception: pass
          media = {}
          for png in sorted(glob.glob("/tmp/png/*.png")):
              key = os.path.splitext(os.path.basename(png))[0]
              _, url = up(open(png, "rb").read(), ALT.get(key, key), f"{key}.png")
              media[key] = url; print(f"인포그래픽: {key} → {url}")

          # 2) 마크다운 → [[IMG]] 치환
          md = re.sub(r"<!--.*?-->", "", open(os.environ["DRAFT_PATH"], encoding="utf-8").read(), flags=re.S)
          md = re.sub(r"\[\[IMG:([a-zA-Z0-9_-]+)\]\]",
                      lambda mo: fig(media[mo.group(1)], ALT.get(mo.group(1), mo.group(1))) if mo.group(1) in media else "", md)
          lines = md.split("\n"); title = os.path.basename(os.environ["DRAFT_PATH"])
          for i, l in enumerate(lines):
              if re.match(r"^#\s+", l): title = re.sub(r"^#\s+", "", l).strip(); del lines[i]; break
          html = markdown.markdown("\n".join(lines), extensions=["tables", "nl2br"])

          # 3) [[PRODUCT:key]] → 상품 카드 HTML (마크다운 변환 후 치환)
          def product(mo):
              key = mo.group(1)
              path = os.path.join(product_dir, f"{key}.html")
              try:
                  return "\n" + open(path, encoding="utf-8").read().strip() + "\n"
              except Exception:
                  print(f"::warning::상품 파일 없음: {path}"); return ""
          html = re.sub(r"<p>\s*\[\[PRODUCT:([a-zA-Z0-9_-]+)\]\]\s*</p>", product, html)
          html = re.sub(r"\[\[PRODUCT:([a-zA-Z0-9_-]+)\]\]", product, html)

          # 4) 썸네일(대표) + 핵심사진(본문)
          #
          # 2026-08-20 운영자 지시: 이미지는 OpenAI API 로 만들지 않는다.
          # ChatGPT Plus 가 만든 것을 드라이브로 받아 drafts/img/ 에 넣고 그걸 쓴다.
          # API 비용 0. allow_ai_images=y 로 명시하지 않으면 OpenAI 를 호출하지 않는다.
          img_slug = (os.environ.get("IMG_SLUG") or "").strip()
          allow_ai = (os.environ.get("ALLOW_AI_IMAGES") or "n").strip().lower() == "y"

          def local(kind):
              """drafts/img/<슬러그>-<kind>.png 를 찾는다. 없으면 None."""
              if not img_slug:
                  return None
              for name in (f"drafts/img/{img_slug}-{kind}.png",
                           f"drafts/img/{img_slug}-{kind}.jpg"):
                  if os.path.exists(name):
                      return name
              return None

          def pick(kind, prompt_env, label):
              path = local(kind)
              if path:
                  print(f"{label}: 로컬 파일 사용 — {path}")
                  return open(path, "rb").read()
              if allow_ai:
                  prompt = (os.environ.get(prompt_env) or "").strip()
                  if not prompt:
                      print(f"::error::{label} 프롬프트가 비었습니다 (allow_ai_images=y)"); raise SystemExit(1)
                  print(f"::warning::{label}: 로컬 파일이 없어 OpenAI 를 호출합니다 (비용 발생)")
                  return genai(prompt)
              print(f"::error::{label} 이미지를 찾지 못했습니다.")
              print(f"  찾은 경로: drafts/img/{img_slug or '<img_slug 미지정>'}-{kind}.png")
              print("  ChatGPT 로 만든 이미지를 그 경로에 넣고 커밋한 뒤 다시 돌리세요.")
              print("  AI 생성을 정말 쓰려면 allow_ai_images=y 로 명시해야 합니다(운영자 허락 필요).")
              raise SystemExit(1)

          # thumb_alt / mid_alt 입력이 비거나 기본값이면 초안 주석에서 읽는다.
          # 입력으로 넘기면 전송 중 한글이 깨진다(끝→끕, 세척→세첤). 디스크 파일은 안 깨진다.
          # 초안에 <!-- 확정 썸네일 alt: ... --> / <!-- 확정 본문 alt: ... --> 주석을 둔다.
          _draft_txt = open(os.environ["DRAFT_PATH"], encoding="utf-8").read()
          def alt_from_draft(env, label_re, default):
              v = (os.environ.get(env) or "").strip()
              if v and v != default:
                  return v
              m = re.search(label_re, _draft_txt, re.S)
              if m:
                  return re.sub(r"\s+", " ", m.group(1)).strip()
              return default
          THUMB_ALT = alt_from_draft("THUMB_ALT", r"확정\s*썸네일\s*alt\s*[:：]\s*(.+?)-->", "대표 이미지")
          MID_ALT   = alt_from_draft("MID_ALT",   r"확정\s*본문\s*alt\s*[:：]\s*(.+?)-->",   "본문 이미지")
          print(f"썸네일 alt = {THUMB_ALT}")
          print(f"본문 alt   = {MID_ALT}")

          tid, _ = up(pick("thumb", "THUMB_PROMPT", "썸네일"),
                      THUMB_ALT, "thumbnail.png")
          _, murl = up(pick("body", "MID_PROMPT", "본문 이미지"),
                       MID_ALT, "inline.png")
          figm = fig(murl, MID_ALT)
          def anchor_match(a):
              a = (a or "").strip()
              if not a: return None
              return re.compile(r'(<h2[^>]*>\s*' + re.escape(a) + r'\s*</h2>)')
          # 입력 anchor 로 먼저 찾고, 못 찾으면(전송 중 한글 깨짐) 초안 주석의 anchor 로 재시도한다.
          anchor = os.environ["MID_ANCHOR"].strip()
          pat = anchor_match(anchor)
          if not (pat and pat.search(html)):
              m = re.search(r"본문\s*이미지\s*위치[^=]*=\s*['\"]?(.+?)['\"]?\s*-->", _draft_txt, re.S)
              if m:
                  alt_anchor = re.sub(r"\s+", " ", m.group(1)).strip()
                  print(f"::warning::입력 mid_anchor '{anchor}' 로 못 찾아 초안 주석 anchor '{alt_anchor}' 로 재시도")
                  pat = anchor_match(alt_anchor)
          if pat and pat.search(html): html = pat.sub(figm + r'\1', html, count=1)
          else:
              print(f"::warning::mid_anchor 를 본문에서 못 찾아 이미지를 글 끝에 붙입니다"); html += figm

          # 5) 빈 CTA 제거
          html = re.sub(r"<p>[^<]*👉[^<]*</p>\s*", "", html)

          # 6) 광고표시 문구(스타일·따옴표) 상단 삽입
          fs = (os.environ.get("DISCLOSURE_FONT") or "13").strip()
          disc_text = "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
          html = f'<p style="font-size:{fs}px;color:#8A8378;">“{disc_text}”</p>\n\n' + html

          # 7) 카테고리 해결 — 입력 카테고리가 전송 중 깨질 수 있어(예: 병→벑) 검색이 빈손이면
          #    초안 주석/헤더의 카테고리(디스크, 안 깨짐)로 재시도한다. anchor·스니펫·alt 와 같은 방식.
          #    새로 만들 땐 반드시 디스크 이름으로만 만든다 — 깨진 입력으로 유령 카테고리를 만들지 않는다.
          payload = {"title": title, "content": html, "status": os.environ.get("POST_STATUS", "publish"), "featured_media": tid}
          # 예약발행: publish_at 이 있으면 그 시각(사이트 현지=KST)에 자동 발행되도록 status=future + date
          pub_at = (os.environ.get("PUBLISH_AT") or "").strip()
          if pub_at:
              payload["date"] = pub_at
              payload["status"] = "future"
              print(f"예약발행: {pub_at} (KST) 로 status=future 설정")
          slug = (os.environ.get("CATEGORY_SLUG") or "").strip()
          def _find_cat(nm):
              nm = (nm or "").strip()
              if not nm: return None
              rc = requests.get(f"{base}/wp-json/wp/v2/categories", params={"search": nm}, auth=auth, timeout=30)
              if rc.ok:
                  mt = [c for c in rc.json() if c.get("name") == nm]
                  if mt: return mt[0]["id"]
              return None
          name = (os.environ.get("CATEGORY_NAME") or "").strip()
          cid = _find_cat(name)
          disk_name = None
          if cid is None:
              m = re.search(r"확정\s*카테고리\s*[:：]\s*(.+?)\s*-->", _draft_txt)
              if not m:
                  m = re.search(r"카테고리\s+([가-힣A-Za-z·]+)", _draft_txt)
              if m:
                  disk_name = re.sub(r"\s+", " ", m.group(1)).strip()
                  if disk_name and disk_name != name:
                      print(f"::warning::입력 카테고리 '{name}' 를 못 찾아 초안 '{disk_name}' 로 재시도")
                  cid = _find_cat(disk_name)
          if cid is None and disk_name:
              body = {"name": disk_name}
              if slug: body["slug"] = slug
              cr = requests.post(f"{base}/wp-json/wp/v2/categories", json=body, auth=auth, timeout=30)
              if cr.ok:
                  cid = cr.json().get("id"); print(f"카테고리 생성: {disk_name} (#{cid}, slug={slug or '자동'})")
              elif cr.status_code == 400 and "term_exists" in cr.text:
                  cid = (cr.json().get("data") or {}).get("term_id"); print(f"카테고리 이미 있음: {disk_name} (#{cid})")
              else:
                  print(f"::warning::카테고리 생성 실패 {cr.status_code}: {cr.text[:200]}")
          if cid: payload["categories"] = [cid]
          elif name or disk_name: print(f"::warning::카테고리 지정 실패 — 기본 분류로 갑니다")

          # 8) 업데이트(있으면) 또는 새 발행
          pid = (os.environ.get("POST_ID") or "").strip()
          url = f"{base}/wp-json/wp/v2/posts/{pid}" if pid else f"{base}/wp-json/wp/v2/posts"
          r = requests.post(url, json=payload, auth=auth, timeout=90)
          if not r.ok:
              print(f"::error::저장 실패 {r.status_code}: {r.text[:400]}"); raise SystemExit(1)
          p = r.json()
          print(f"=== {'업데이트' if pid else '발행'} 완료 #{p.get('id')} ({p.get('status')}) ===")
          print("제목:", p.get("title", {}).get("rendered"))
          print("링크:", p.get("link"))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"PUBLISHED_ID={p.get('id')}\n")
          PY


      # 2026-08-19: 발행 뒤에 슬러그·태그·스니펫·점검을 각각 따로 돌리느라
      # 워크플로우를 네 번 띄우고 그때마다 기다렸다. 다 잘 돌아도 10분이 넘었다.
      # 한 잡 안에서 이어서 끝낸다. 입력을 비우면 해당 단계는 건너뛴다.
      - name: 슬러그·태그
        if: ${{ github.event.inputs.slug != '' || github.event.inputs.tags != '' }}
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SLUG: ${{ github.event.inputs.slug }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          python3 - <<'PY'
          import os, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid  = os.environ["PUBLISHED_ID"]

          body = {}
          slug = (os.environ.get("SLUG") or "").strip()
          if slug:
              body["slug"] = slug

          names = [x.strip() for x in (os.environ.get("TAGS") or "").split(",") if x.strip()]
          if names:
              ids = []
              for n in names:
                  r = requests.get(f"{base}/wp-json/wp/v2/tags",
                                   params={"search": n}, auth=auth, timeout=30)
                  hit = next((t for t in (r.json() if r.ok else []) if t.get("name") == n), None)
                  if hit:
                      ids.append(hit["id"]); continue
                  c = requests.post(f"{base}/wp-json/wp/v2/tags",
                                    json={"name": n}, auth=auth, timeout=30)
                  if c.ok:
                      ids.append(c.json()["id"])
                  elif c.status_code == 400 and "term_exists" in c.text:
                      ids.append(c.json()["data"]["term_id"])
                  else:
                      print(f"::warning::태그 '{n}' 처리 실패 {c.status_code}")
              if ids:
                  body["tags"] = ids

          if not body:
              print("적용할 것 없음"); raise SystemExit(0)
          r = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}", json=body, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::슬러그·태그 저장 실패 {r.status_code}: {r.text[:300]}"); raise SystemExit(1)
          j = r.json()
          print(f"슬러그={j.get('slug')} 태그={len(j.get('tags') or [])}개")
          print("링크:", j.get("link"))
          PY

      # Rank Math 메타는 REST 로 안 들어간다(show_in_rest 미등록).
      # excerpt 는 들어가고, Rank Math 기본 설명 템플릿이 %excerpt% 라 스니펫에 쓰인다.
      # seo_description 입력이 비면 초안의 <!-- 확정 스니펫: ... --> 주석에서 읽는다.
      # 입력으로 넘긴 한글은 전송 중 깨지는 일이 있어(쉬→쉐, 텨→텔, 컥→컵) 초안 파일을 신뢰한다.
      # 초안 주석은 디스크에서 그대로 오므로 깨지지 않는다.
      - name: 검색 스니펫 (excerpt)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DESC: ${{ github.event.inputs.seo_description }}
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
        run: |
          python3 - <<'PY'
          import os, re, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid  = os.environ["PUBLISHED_ID"]
          desc = (os.environ.get("DESC") or "").strip()
          src = "입력"
          if not desc:
              path = (os.environ.get("DRAFT_PATH") or "").strip()
              if path and os.path.exists(path):
                  txt = open(path, encoding="utf-8").read()
                  m = re.search(r"확정\s*스니펫\s*[:：]\s*(.+?)-->", txt, re.S)
                  if m:
                      desc = re.sub(r"\s+", " ", m.group(1)).strip()
                      src = "초안 주석"
          if not desc:
              print("::notice::스니펫이 없어 excerpt 단계를 건너뜁니다. (입력·초안 주석 모두 없음)")
              raise SystemExit(0)
          r = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}",
                            json={"excerpt": desc}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::excerpt 저장 실패 {r.status_code}: {r.text[:300]}"); raise SystemExit(1)
          print(f"excerpt 저장됨 ({src}):", desc[:60], "...")
          print("::notice::Rank Math 포커스 키워드는 REST 로 안 들어갑니다. 편집기에서 직접 입력하세요.")
          PY

      - name: 발행 후 점검
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid  = os.environ["PUBLISHED_ID"]
          r = requests.get(f"{base}/wp-json/wp/v2/posts/{pid}",
                           params={"context": "edit"}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::조회 실패 {r.status_code}"); raise SystemExit(1)
          j = r.json(); c = j.get("content", {}).get("raw", "")

          print("=" * 62)
          print(f"#{pid}  {j.get('title', {}).get('raw', '')}")
          print(f"슬러그: {j.get('slug')}   상태: {j.get('status')}   본문 {len(c):,}자")
          print("링크:", j.get("link"))
          print("=" * 62)

          fails = []
          def ok(label, cond):
              print(f"  {'O' if cond else 'X'}  {label}")
              if not cond: fails.append(label)

          disc = c.count("쿠팡 파트너스 활동의 일환으로")
          ok(f"광고표시 문구 1회 (실제 {disc}회)", disc == 1)
          for tok in ("[[PRODUCT", "[[IMG"):
              n = c.count(tok); ok(f"미치환 토큰 {tok} 없음 (실제 {n}개)", n == 0)
          ok(f"이미지 태그 {len(re.findall(r'<img', c))}개", "<img" in c)
          cdn = len(re.findall(r"coupangcdn", c))
          ok(f"쿠팡 배너 이미지 미사용 (coupangcdn {cdn}개)", cdn == 0)
          flex = len(re.findall(r"display:\s*flex", c))
          ok(f"카드 가로 flex 미사용 ({flex}개)", flex == 0)

          m = re.search(r"link\.coupang\.com/a/([A-Za-z0-9]+)", c)
          if m:
              code = m.group(1); n = c.count(code)
              ok(f"딥링크 {code} {n}개 (기대 3 = 카드제목·CTA·본문인라인)", n == 3)
          else:
              print("  ·  딥링크 없음 (정보성 글이면 정상)")

          print()
          if fails:
              print("::warning::확인 필요 — " + " / ".join(fails))
          else:
              print("전부 통과.")
          PY
