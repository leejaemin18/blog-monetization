name: 포스트 재작성 (기존 글 업데이트 · 이미지+상품카드+광고문구)

# 초안(md)으로 기존 글(post_id)을 통째로 다시 빌드해 업데이트한다.
# SVG 인포그래픽 + [[PRODUCT:key]] 상품카드 + AI 썸네일/핵심사진 + 상단 광고표시 문구(스타일).
# post_id를 비우면 새 글로 발행.

on:
  workflow_dispatch:
    inputs:
      post_id: { description: '업데이트할 글 번호(ID). 비우면 새 글 발행', required: false }
      draft_path: { description: '초안 md 경로', required: true }
      image_dir: { description: 'SVG 인포그래픽 폴더', required: false, default: 'assets/images' }
      product_dir: { description: '[[PRODUCT:key]] 상품 HTML 폴더', required: false, default: 'assets/products' }
      category_name: { description: '카테고리 이름', required: false }
      category_slug: { description: '카테고리 슬러그 (새로 만들 때만)', required: false }
      thumb_prompt: { description: 'AI 썸네일 프롬프트', required: true }
      thumb_alt: { description: '썸네일 alt', required: false, default: '대표 이미지' }
      mid_prompt: { description: 'AI 핵심사진 프롬프트', required: true }
      mid_alt: { description: '핵심사진 alt', required: false, default: '본문 이미지' }
      mid_anchor: { description: '핵심사진을 넣을 소제목(h2)', required: true }
      disclosure_font: { description: '광고표시 문구 글씨 크기(px)', required: false, default: '13' }
      status: { description: 'publish / draft', required: false, default: 'publish' }
      skip_gate: { description: '발행 전 검사 건너뛰기 (y/n) — 이유가 있을 때만', required: false, default: 'n' }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 규칙을 문서에만 두면 지켜지지 않는다. 발행 경로에 검사를 물려 못 지나가게 한다.
      # 컴플라이언스(광고표시·금지어) + AI 티(번역투·대구·쉼표) 둘 다 본다.
      - name: 발행 전 검사
        env:
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
          SKIP_GATE: ${{ github.event.inputs.skip_gate }}
        run: |
          if [ "${SKIP_GATE:0:1}" = "y" ] || [ "${SKIP_GATE:0:1}" = "Y" ]; then
            echo "::warning::발행 전 검사를 건너뜁니다 (skip_gate=y)"; exit 0
          fi
          fail=0
          python3 tools/compliance.py "$DRAFT_PATH" || fail=1
          python3 tools/humanize.py  "$DRAFT_PATH" --gate || fail=1
          if [ "$fail" != "0" ]; then
            echo "::error::발행 전 검사에서 막혔습니다. 초안을 고치거나, 이유가 있으면 skip_gate=y로 다시 실행하세요."
            exit 1
          fi
      # 2026-08-19: apt 가 세 번 연속 이 자리에서 멈췄다(7분+ 무한 대기).
      # 미러가 응답을 안 하면 apt 기본 타임아웃이 매우 길어 잡이 통째로 걸린다.
      #
      # 인포그래픽 SVG 에 한글이 들어가므로 CJK 폰트가 없으면 전부 네모로 깨진다.
      # 그래서 apt 가 실패해도 폰트만은 반드시 확보해야 한다 —
      # Google Fonts 저장소에서 Noto Sans KR 을 직접 받아 fontconfig 에 등록한다.
      # 폰트가 끝내 없으면 깨진 이미지를 발행하느니 여기서 멈춘다.
      - name: 변환기 (apt, 실패해도 계속)
        timeout-minutes: 3
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
            -o Acquire::Retries=1 || echo "::warning::apt-get update 실패"
          sudo apt-get install -y -qq \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
            -o Acquire::Retries=1 \
            librsvg2-bin fonts-noto-cjk || echo "::warning::apt 설치 실패 — 대체 경로로 간다"

      - name: 한글 폰트 확보
        run: |
          have_cjk() { fc-list 2>/dev/null | grep -qiE "noto sans (cjk|kr)|nanum"; }
          if have_cjk; then
            echo "CJK 폰트 있음 (apt 로 설치됨)"
          else
            echo "::warning::CJK 폰트 없음 — Noto Sans KR 을 직접 받는다"
            mkdir -p ~/.fonts
            for u in \
              "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" ; do
              curl -fsSL --max-time 60 "$u" -o ~/.fonts/NotoSansKR.ttf && break
            done
            fc-cache -f >/dev/null 2>&1 || true
          fi
          echo "--- 설치된 한글 폰트 ---"
          fc-list 2>/dev/null | grep -iE "noto sans (cjk|kr)|nanum" | head -3
          if ! have_cjk; then
            echo "::error::한글 폰트를 확보하지 못했습니다. 인포그래픽이 네모로 깨진 채 발행되므로 여기서 멈춥니다."
            exit 1
          fi

      - name: SVG → PNG
        env:
          IMAGE_DIR: ${{ github.event.inputs.image_dir }}
        run: |
          DIR="${IMAGE_DIR:-assets/images}"; mkdir -p /tmp/png
          if command -v rsvg-convert >/dev/null 2>&1; then
            echo "변환기: rsvg-convert"
            for f in "$DIR"/*.svg; do
              [ -e "$f" ] || continue
              rsvg-convert "$f" -o "/tmp/png/$(basename "$f" .svg).png"
            done
          else
            echo "::warning::rsvg-convert 없음 — cairosvg 로 변환한다"
            pip -q install cairosvg
            python3 - <<'PYCONV'
          import glob, os, pathlib, cairosvg
          d = os.environ.get("IMAGE_DIR") or "assets/images"
          for f in sorted(glob.glob(os.path.join(d, "*.svg"))):
              out = "/tmp/png/" + pathlib.Path(f).stem + ".png"
              cairosvg.svg2png(url=f, write_to=out, output_width=1000)
              print("변환:", f, "→", out)
          PYCONV
          fi
          ls -la /tmp/png || true

      - name: 빌드 + 업데이트
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
          IMAGE_DIR: ${{ github.event.inputs.image_dir }}
          PRODUCT_DIR: ${{ github.event.inputs.product_dir }}
          CATEGORY_NAME: ${{ github.event.inputs.category_name }}
          CATEGORY_SLUG: ${{ github.event.inputs.category_slug }}
          THUMB_PROMPT: ${{ github.event.inputs.thumb_prompt }}
          THUMB_ALT: ${{ github.event.inputs.thumb_alt }}
          MID_PROMPT: ${{ github.event.inputs.mid_prompt }}
          MID_ALT: ${{ github.event.inputs.mid_alt }}
          MID_ANCHOR: ${{ github.event.inputs.mid_anchor }}
          DISCLOSURE_FONT: ${{ github.event.inputs.disclosure_font }}
          POST_STATUS: ${{ github.event.inputs.status }}
        run: |
          pip -q install markdown requests
          python3 - <<'PY'
          import os, re, glob, json, base64, requests, markdown
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          oai = (os.environ.get("OPENAI_KEY") or "").strip()
          image_dir = (os.environ.get("IMAGE_DIR") or "assets/images").strip()
          product_dir = (os.environ.get("PRODUCT_DIR") or "assets/products").strip()

          def up(data, alt, fname):
              r = requests.post(f"{base}/wp-json/wp/v2/media",
                  headers={"Content-Type": "image/png", "Content-Disposition": f'attachment; filename="{fname}"'},
                  data=data, auth=auth, timeout=120)
              if not r.ok:
                  print(f"::error::미디어 업로드 실패 {r.status_code}: {r.text[:300]}"); raise SystemExit(1)
              m = r.json()
              requests.post(f"{base}/wp-json/wp/v2/media/{m['id']}", json={"alt_text": alt}, auth=auth, timeout=30)
              return m["id"], m["source_url"]

          def fig(url, alt):
              return f'<figure style="text-align:center;margin:1.5em 0"><img src="{url}" alt="{alt}" style="max-width:100%;height:auto;border-radius:10px"/></figure>\n'

          def genai(prompt):
              for body in [
                  {"model": "gpt-image-1", "prompt": prompt, "size": "1536x1024", "n": 1},
                  {"model": "dall-e-3", "prompt": prompt, "size": "1792x1024", "n": 1, "response_format": "b64_json"},
              ]:
                  r = requests.post("https://api.openai.com/v1/images/generations",
                      headers={"Authorization": f"Bearer {oai}", "Content-Type": "application/json"}, json=body, timeout=180)
                  if r.ok:
                      print(f"{body['model']} 생성 성공"); return base64.b64decode(r.json()["data"][0]["b64_json"])
                  print(f"{body['model']} 실패 {r.status_code}: {r.text[:200]}")
              raise SystemExit("::error::AI 이미지 생성 실패")

          # 1) 인포그래픽 업로드
          ALT = {}
          try: ALT = json.load(open(os.path.join(image_dir, "alt.json"), encoding="utf-8"))
          except Exception: pass
          media = {}
          for png in sorted(glob.glob("/tmp/png/*.png")):
              key = os.path.splitext(os.path.basename(png))[0]
              _, url = up(open(png, "rb").read(), ALT.get(key, key), f"{key}.png")
              media[key] = url; print(f"인포그래픽: {key} → {url}")

          # 2) 마크다운 → [[IMG]] 치환
          md = re.sub(r"<!--.*?-->", "", open(os.environ["DRAFT_PATH"], encoding="utf-8").read(), flags=re.S)
          md = re.sub(r"\[\[IMG:([a-zA-Z0-9_-]+)\]\]",
                      lambda mo: fig(media[mo.group(1)], ALT.get(mo.group(1), mo.group(1))) if mo.group(1) in media else "", md)
          lines = md.split("\n"); title = os.path.basename(os.environ["DRAFT_PATH"])
          for i, l in enumerate(lines):
              if re.match(r"^#\s+", l): title = re.sub(r"^#\s+", "", l).strip(); del lines[i]; break
          html = markdown.markdown("\n".join(lines), extensions=["tables", "nl2br"])

          # 3) [[PRODUCT:key]] → 상품 카드 HTML (마크다운 변환 후 치환)
          def product(mo):
              key = mo.group(1)
              path = os.path.join(product_dir, f"{key}.html")
              try:
                  return "\n" + open(path, encoding="utf-8").read().strip() + "\n"
              except Exception:
                  print(f"::warning::상품 파일 없음: {path}"); return ""
          html = re.sub(r"<p>\s*\[\[PRODUCT:([a-zA-Z0-9_-]+)\]\]\s*</p>", product, html)
          html = re.sub(r"\[\[PRODUCT:([a-zA-Z0-9_-]+)\]\]", product, html)

          # 4) AI 썸네일(대표) + 핵심사진(본문)
          tid, _ = up(genai(os.environ["THUMB_PROMPT"]), os.environ.get("THUMB_ALT", "대표 이미지"), "thumbnail.png")
          _, murl = up(genai(os.environ["MID_PROMPT"]), os.environ.get("MID_ALT", "본문 이미지"), "inline.png")
          figm = fig(murl, os.environ.get("MID_ALT", "본문 이미지"))
          anchor = os.environ["MID_ANCHOR"].strip()
          pat = re.compile(r'(<h2[^>]*>\s*' + re.escape(anchor) + r'\s*</h2>)')
          if pat.search(html): html = pat.sub(figm + r'\1', html, count=1)
          else: html += figm

          # 5) 빈 CTA 제거
          html = re.sub(r"<p>[^<]*👉[^<]*</p>\s*", "", html)

          # 6) 광고표시 문구(스타일·따옴표) 상단 삽입
          fs = (os.environ.get("DISCLOSURE_FONT") or "13").strip()
          disc_text = "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
          html = f'<p style="font-size:{fs}px;color:#8A8378;">“{disc_text}”</p>\n\n' + html

          # 7) 카테고리 해결 — 없으면 만든다.
          # 예전엔 못 찾으면 조용히 넘어가서 새 카테고리를 쓰려던 글이 기본 분류로 갔다.
          payload = {"title": title, "content": html, "status": os.environ.get("POST_STATUS", "publish"), "featured_media": tid}
          name = (os.environ.get("CATEGORY_NAME") or "").strip()
          slug = (os.environ.get("CATEGORY_SLUG") or "").strip()
          if name:
              cid = None
              rc = requests.get(f"{base}/wp-json/wp/v2/categories", params={"search": name}, auth=auth, timeout=30)
              if rc.ok:
                  mt = [c for c in rc.json() if c.get("name") == name]
                  if mt: cid = mt[0]["id"]
              if cid is None:
                  body = {"name": name}
                  if slug: body["slug"] = slug
                  cr = requests.post(f"{base}/wp-json/wp/v2/categories", json=body, auth=auth, timeout=30)
                  if cr.ok:
                      cid = cr.json().get("id")
                      print(f"카테고리 생성: {name} (#{cid}, slug={slug or '자동'})")
                  elif cr.status_code == 400 and "term_exists" in cr.text:
                      cid = (cr.json().get("data") or {}).get("term_id")
                      print(f"카테고리 이미 있음: {name} (#{cid})")
                  else:
                      print(f"::warning::카테고리 생성 실패 {cr.status_code}: {cr.text[:200]}")
              if cid: payload["categories"] = [cid]
              else:   print(f"::warning::카테고리 '{name}' 을 지정하지 못했습니다 — 기본 분류로 갑니다")

          # 8) 업데이트(있으면) 또는 새 발행
          pid = (os.environ.get("POST_ID") or "").strip()
          url = f"{base}/wp-json/wp/v2/posts/{pid}" if pid else f"{base}/wp-json/wp/v2/posts"
          r = requests.post(url, json=payload, auth=auth, timeout=90)
          if not r.ok:
              print(f"::error::저장 실패 {r.status_code}: {r.text[:400]}"); raise SystemExit(1)
          p = r.json()
          print(f"=== {'업데이트' if pid else '발행'} 완료 #{p.get('id')} ({p.get('status')}) ===")
          print("제목:", p.get("title", {}).get("rendered"))
          print("링크:", p.get("link"))
          PY
