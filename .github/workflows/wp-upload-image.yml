name: 외부 이미지 → 워드프레스 미디어 업로드 (URL 반환)

# 외부 이미지 URL을 다운로드해 워드프레스 미디어로 올리고 로컬 주소를 출력한다.
# (사이드바 배너 등 본문 밖에서 쓸 이미지 재호스팅용)

on:
  workflow_dispatch:
    inputs:
      image_url: { description: '업로드할 외부 이미지 URL', required: true }
      filename: { description: '저장 파일명', required: false, default: 'sidebar-banner.jpg' }
      alt: { description: '이미지 alt', required: false, default: '쿠팡 반려동물용품' }

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 업로드
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          IMAGE_URL: ${{ github.event.inputs.image_url }}
          FILENAME: ${{ github.event.inputs.filename }}
          ALT: ${{ github.event.inputs.alt }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          iurl = os.environ["IMAGE_URL"].strip()
          fname = os.environ["FILENAME"].strip()
          alt = os.environ["ALT"].strip()

          ir = requests.get(iurl, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://link.coupang.com/"}, timeout=60)
          if not ir.ok:
              print(f"::error::다운로드 실패 {ir.status_code}"); raise SystemExit(1)
          ctype = ir.headers.get("Content-Type", "image/jpeg").split(";")[0]
          print(f"다운로드 성공: {len(ir.content)} bytes, {ctype}")

          mr = requests.post(f"{base}/wp-json/wp/v2/media",
              headers={"Content-Type": ctype, "Content-Disposition": f'attachment; filename="{fname}"'},
              data=ir.content, auth=auth, timeout=120)
          if not mr.ok:
              print(f"::error::업로드 실패 {mr.status_code}: {mr.text[:300]}"); raise SystemExit(1)
          m = mr.json()
          requests.post(f"{base}/wp-json/wp/v2/media/{m['id']}", json={"alt_text": alt}, auth=auth, timeout=30)
          print("=== 업로드 완료 ===")
          print("LOCAL_URL:", m["source_url"])
          PY
