name: 지식iN 미답변 목록 구조 탐색 (1회성)

# 지식iN "답변대기(미답변)" 목록 페이지의 실제 URL과 HTML 구조를 확인하기 위한 탐색용.
# 구조를 파악해 본 수집 워크플로우를 만든 뒤에는 삭제해도 된다.

on:
  workflow_dispatch:
    inputs:
      dir_id:
        description: "카테고리 dirId (반려동물 계열)"
        required: false
        default: "8050"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 후보 URL 탐색
        env:
          DIR_ID: ${{ github.event.inputs.dir_id }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, html, requests
          d = (os.environ.get("DIR_ID") or "8050").strip()
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          H = {"User-Agent": UA, "Accept-Language": "ko-KR,ko;q=0.9"}

          cands = [
            f"https://kin.naver.com/qna/list.naver?dirId={d}",
            f"https://kin.naver.com/qna/list.naver?dirId={d}&queryTime=",
            f"https://kin.naver.com/qna/list.naver?dirId={d}&answerStatus=NO_ANSWER",
            f"https://kin.naver.com/qna/noanswerList.naver?dirId={d}",
            f"https://kin.naver.com/answer/list.naver?dirId={d}",
            f"https://kin.naver.com/qna/kinupdown.naver?dirId={d}",
            "https://kin.naver.com/qna/list.naver",
          ]
          for u in cands:
              try:
                  r = requests.get(u, headers=H, timeout=20)
              except Exception as e:
                  print(f"[X] {u} -> {type(e).__name__}"); continue
              t = r.text
              n_q = len(re.findall(r"/qna/detail\.naver\?[^\"']*docId=\d+", t))
              has_wait = ("답변대기" in t) or ("미답변" in t) or ("답변이 없" in t)
              print(f"[{r.status_code}] len={len(t):>7} 상세링크={n_q:>3} 답변대기문구={has_wait}  {u}")

          # 가장 정보가 많은 기본 목록에서 구조 덤프
          base = f"https://kin.naver.com/qna/list.naver?dirId={d}"
          r = requests.get(base, headers=H, timeout=20)
          t = r.text
          print("\n=== 페이지 내 탭/필터 링크 (답변 관련) ===")
          for m in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>([^<]{1,30})</a>', t):
              if any(k in m[1] for k in ("답변", "미답변", "대기", "전체")):
                  print(f"  {html.unescape(m[1]).strip():<12} {html.unescape(m[0])[:120]}")

          print("\n=== 질문 항목 샘플 (앞 5개) ===")
          for m in re.findall(r'<a[^>]+href="(/qna/detail\.naver\?[^"]*docId=\d+[^"]*)"[^>]*>(.{1,80}?)</a>', t)[:5]:
              title = html.unescape(re.sub(r"<[^>]+>", "", m[1])).strip()
              print(f"  {title[:50]}\n    https://kin.naver.com{html.unescape(m[0])}")

          print("\n=== '답변' 개수 표기로 보이는 패턴 ===")
          for pat in [r'답변\s*<[^>]*>\s*\d+', r'class="[^"]*answer[^"]*"[^>]*>\s*\d+', r'답변수\D{0,10}\d+']:
              found = re.findall(pat, t)[:5]
              print(f"  {pat} -> {found}")
          PY
