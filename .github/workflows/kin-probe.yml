name: 지식iN 미답변 목록 구조 탐색 (1회성)

# 지식iN "답변대기(미답변)" 목록의 실제 URL과 HTML 구조를 확인하기 위한 탐색용.
# 구조를 파악해 본 수집 워크플로우를 만든 뒤에는 삭제한다.

on:
  workflow_dispatch:
    inputs:
      dir_ids:
        description: "테스트할 dirId 목록(콤마)"
        required: false
        default: "80502,80511,8050103,8050105,80501"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 데스크톱·모바일 목록 탐색
        env:
          DIR_IDS: ${{ github.event.inputs.dir_ids }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, html, requests
          ids = [x.strip() for x in (os.environ.get("DIR_IDS") or "80502").split(",") if x.strip()]
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          UAD = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"

          def probe(u, ua, label):
              try:
                  r = requests.get(u, headers={"User-Agent": ua, "Accept-Language": "ko-KR,ko;q=0.9"}, timeout=20)
              except Exception as e:
                  print(f"  [X] {label} {type(e).__name__}"); return None
              t = r.text
              n = len(re.findall(r"docId=\d+", t))
              wait = sum(k in t for k in ("답변대기", "미답변", "답변이 없", "답변 0"))
              print(f"  [{r.status_code}] len={len(t):>7} docId={n:>3} 대기표현={wait}  {label}")
              return t if r.ok and n > 0 else None

          best = None
          for d in ids:
              print(f"\n### dirId={d}")
              for u, ua, lb in [
                  (f"https://kin.naver.com/qna/list.naver?dirId={d}", UAD, "PC list"),
                  (f"https://m.kin.naver.com/mobile/qna/list.naver?dirId={d}", UA, "M list"),
                  (f"https://m.kin.naver.com/mobile/qna/list.naver?dirId={d}&queryTime=&page=1", UA, "M list p1"),
                  (f"https://kin.naver.com/qna/list.naver?dirId={d}&sortType=none&queryTime=", UAD, "PC sort"),
              ]:
                  t = probe(u, ua, lb)
                  if t and best is None:
                      best = (u, t)

          if not best:
              print("\n::warning::목록을 가져온 URL이 없습니다.")
              raise SystemExit(0)

          u, t = best
          print(f"\n=== 구조 덤프 대상: {u} ===")
          # 상세 링크 주변 400자를 몇 개 출력해 답변수 표기 위치를 찾는다
          for m in list(re.finditer(r"docId=\d+", t))[:3]:
              s = max(0, m.start() - 250); e = min(len(t), m.end() + 400)
              chunk = re.sub(r"\s+", " ", t[s:e])
              print("\n--- 조각 ---")
              print(chunk[:600])
          PY
