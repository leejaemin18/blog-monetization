name: 지식인 질문 찾기 (노견 등)

# 네이버 검색 오픈API(읽기 전용)로 최근 지식인 질문을 수집해 로그로 출력한다.
# 답변 등록/자동게시는 하지 않는다(정책 위반). Claude가 로그를 읽어 목록을 정리하고,
# 사람이 직접 골라 답변한다. Client ID/Secret은 시크릿에서 읽으며, 로그인 정보는 쓰지 않는다.

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "검색어(콤마 구분)"
        required: false
        default: "노령견 사료,노령견 관절,노견 계단,노령견 영양제,노령견 치아,강아지 치석"
      per_query:
        description: "검색어당 가져올 개수(최대 100)"
        required: false
        default: "10"
      check_answers:
        description: "각 질문 페이지 열어 미답변 여부 확인 (y/n)"
        required: false
        default: "y"

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: 지식인 검색
        env:
          # 실제 존재하는 시크릿만 값이 채워진다(없는 이름은 빈 문자열).
          ID1: ${{ secrets.NAVER_CLIENT_ID }}
          ID2: ${{ secrets.NAVER_API_ID }}
          ID3: ${{ secrets.NAVER_ID }}
          ID4: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          ID5: ${{ secrets.NAVER_CLIENT }}
          ID6: ${{ secrets.NAVER_API_CLIENT_ID }}
          SEC1: ${{ secrets.NAVER_CLIENT_SECRET }}
          SEC2: ${{ secrets.NAVER_API_SECRET }}
          SEC3: ${{ secrets.NAVER_SECRET }}
          SEC4: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          SEC5: ${{ secrets.NAVER_CLIENT_SECRET_KEY }}
          SEC6: ${{ secrets.NAVER_API_CLIENT_SECRET }}
          QUERIES: ${{ github.event.inputs.queries }}
          PER_QUERY: ${{ github.event.inputs.per_query }}
          CHECK: ${{ github.event.inputs.check_answers }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, html, time, requests

          def pick(prefix):
              for i in range(1, 7):
                  v = (os.environ.get(f"{prefix}{i}") or "").strip()
                  if v:
                      return v, f"{prefix}{i}"
              return "", None

          cid, cid_src = pick("ID")
          csec, csec_src = pick("SEC")
          if not cid or not csec:
              print("::error::네이버 Client ID/Secret 시크릿을 찾지 못했습니다.")
              print("확인한 후보 이름:")
              print("  ID  : NAVER_CLIENT_ID / NAVER_API_ID / NAVER_ID / NAVER_SEARCH_CLIENT_ID / NAVER_CLIENT / NAVER_API_CLIENT_ID")
              print("  SEC : NAVER_CLIENT_SECRET / NAVER_API_SECRET / NAVER_SECRET / NAVER_SEARCH_CLIENT_SECRET / NAVER_CLIENT_SECRET_KEY / NAVER_API_CLIENT_SECRET")
              print("실제 시크릿 이름이 이와 다르면 알려주세요.")
              raise SystemExit(1)
          print(f"인증 시크릿 사용: ID<-{cid_src}, SECRET<-{csec_src}")

          headers = {"X-Naver-Client-Id": cid, "X-Naver-Client-Secret": csec}
          queries = [q.strip() for q in (os.environ.get("QUERIES") or "").split(",") if q.strip()]
          per = int(os.environ.get("PER_QUERY") or "10")
          check = (os.environ.get("CHECK") or "y").lower().startswith("y")
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"

          def clean(t):
              return html.unescape(re.sub(r"<[^>]+>", "", t or "")).strip()

          seen, items = set(), []
          for q in queries:
              try:
                  r = requests.get("https://openapi.naver.com/v1/search/kin.json",
                                   params={"query": q, "display": min(per, 100), "sort": "date"},
                                   headers=headers, timeout=20)
              except Exception as e:
                  print(f"::warning::'{q}' 검색 예외: {e}"); continue
              if not r.ok:
                  print(f"::warning::'{q}' 검색 실패 {r.status_code}: {r.text[:150]}"); continue
              for it in r.json().get("items", []):
                  link = it.get("link", "")
                  if not link or link in seen:
                      continue
                  seen.add(link)
                  items.append({"q": q, "title": clean(it.get("title")),
                                "desc": clean(it.get("description")), "link": link})

          print(f"\n총 {len(items)}개 질문 수집 (검색어 {len(queries)}개, 최신순)\n")

          def answer_state(url):
              try:
                  p = requests.get(url, headers={"User-Agent": UA}, timeout=15)
                  t = p.text
                  if ("아직 등록된 답변이 없" in t) or ("답변이 없습니다" in t):
                      return "🟢 미답변"
                  m = (re.search(r'"answerCount"\s*:\s*([0-9]+)', t)
                       or re.search(r"답변\s*<em[^>]*>\s*([0-9]+)", t)
                       or re.search(r"답변수[^0-9]{0,10}([0-9]+)", t))
                  if m:
                      n = int(m.group(1))
                      return "🟢 미답변" if n == 0 else f"⚪ 답변 {n}개"
                  return "⚪ 답변있음(추정)"
              except Exception:
                  return "❓ 확인불가"

          # 미답변 우선 정렬을 위해 상태 먼저 계산
          for it in items:
              it["state"] = answer_state(it["link"]) if check else ""
              if check:
                  time.sleep(0.4)

          order = {"🟢": 0, "❓": 1, "⚪": 2}
          items.sort(key=lambda x: order.get((x["state"][:1] or "⚪"), 2))

          for i, it in enumerate(items, 1):
              print(f"[{i}] {it['state']}  · 검색어: {it['q']}")
              print(f"    제목: {it['title']}")
              if it["desc"]:
                  print(f"    요약: {it['desc'][:130]}")
              print(f"    링크: {it['link']}\n")

          green = sum(1 for it in items if it["state"].startswith("🟢"))
          print(f"=== 요약: 총 {len(items)}개 중 미답변 추정 {green}개 (🟢 우선 정렬) ===")
          if check:
              print("※ 미답변 판정은 러너가 페이지를 열어 추정한 값입니다. ❓는 확인 실패이니 직접 열어보세요.")
          PY
