name: 지식인 질문 찾기 (반려동물)

# 네이버 지식iN 질문을 수집해 research/ 폴더에 md로 저장·커밋한다.
# 제이로그(jaylog)의 kin-research.yml 방식을 가져왔다.
# 필요한 시크릿: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET
#   (구 개발자센터 Client ID/Secret, 신 네이버클라우드 API HUB 키 둘 다 자동 인식)
#
# ※ 읽기 전용이다. 답변 자동 등록은 하지 않는다(네이버 운영정책상 매크로 금지).
#    수집된 질문 중에서 사람이 골라 직접 답변한다.

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "조사할 키워드 (쉼표로 구분)"
        required: true
        default: "노령견 사료, 노령견 관절, 노견 계단, 노령견 영양제, 강아지 치석, 강아지 양치"
      display:
        description: "키워드당 수집 건수 (최대 100)"
        required: false
        default: "30"
      check_answers:
        description: "각 질문 페이지를 열어 미답변 여부 확인 (y/n)"
        required: false
        default: "y"

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 지식iN 질문 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KEYWORDS: ${{ inputs.keywords }}
          DISPLAY: ${{ inputs.display }}
          CHECK_ANSWERS: ${{ inputs.check_answers }}
        run: |
          if [ -z "$NAVER_CLIENT_ID" ] || [ -z "$NAVER_CLIENT_SECRET" ]; then
            echo "::error::NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 시크릿을 먼저 등록하세요."
            echo "저장소 → Settings → Secrets and variables → Actions"
            exit 1
          fi
          python3 .github/scripts/kin_research.py

      - name: 결과 커밋
        run: |
          git config user.name "jipsa-bot"
          git config user.email "actions@github.com"
          git add research/
          git diff --cached --quiet || git commit -m "지식iN 질문 조사 결과 [bot]"
          git push
