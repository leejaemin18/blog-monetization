name: 글 내용 점검 (발행 후 검증)

# 발행 직후 "제대로 들어갔나"를 확인한다. 세션은 블로그에 직접 접근할 수 없어
# REST(context=edit)로 원문을 받아 항목별로 센다.
#
# 2026-08-19: 검사 항목이 옛 글(#245) 기준으로 하드코딩돼 있어서
# 새 글을 넣으면 전부 X로 나왔다. 실패가 아니라 검사 대상이 옛날 값이었는데
# 모르고 보면 발행이 잘못된 줄 안다. 글마다 달라지는 값은 입력으로 뺐다.

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: '점검할 글 번호(ID)'
        required: true
      deeplink_code:
        description: '이 글의 쿠팡 딥링크 코드 (예: gkCi4YsDLg). 몇 개 있는지 센다'
        required: false
        default: ''
      expect_deeplinks:
        description: '딥링크가 몇 개여야 하는가 (기본 3 = 카드제목·CTA·본문인라인)'
        required: false
        default: '3'
      card_marker:
        description: '상품카드가 들어갔는지 확인할 문자열 (예: 두 번째 갈래에 해당하는 제품)'
        required: false
        default: ''
      needle:
        description: '이 문자열 주변을 발췌해서 보여준다'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 점검
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DEEPLINK: ${{ github.event.inputs.deeplink_code }}
          EXPECT_DEEPLINKS: ${{ github.event.inputs.expect_deeplinks }}
          CARD_MARKER: ${{ github.event.inputs.card_marker }}
          NEEDLE: ${{ github.event.inputs.needle }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, requests

          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid  = os.environ["POST_ID"].strip()

          r = requests.get(f"{base}/wp-json/wp/v2/posts/{pid}",
                           params={"context": "edit"}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::조회 실패 {r.status_code}: {r.text[:200]}")
              raise SystemExit(1)
          j = r.json()
          c = j.get("content", {}).get("raw", "")

          print("=" * 66)
          print(f"#{pid}  {j.get('title', {}).get('raw', '')}")
          print(f"슬러그: {j.get('slug')}   상태: {j.get('status')}")
          print(f"본문 길이: {len(c):,}자")
          print("=" * 66)

          fails = []

          def ok(label, cond, detail=""):
              print(f"  {'O' if cond else 'X'}  {label}{('  — ' + detail) if detail else ''}")
              if not cond:
                  fails.append(label)

          # --- 글마다 달라지지 않는 검사 ---
          print("\n[ 공통 ]")
          disc = c.count("쿠팡 파트너스 활동의 일환으로")
          ok(f"광고표시 문구 1회 (실제 {disc}회)", disc == 1,
             "0이면 누락, 2 이상이면 초안에 직접 써서 중복된 것")

          for tok in ("[[PRODUCT", "[[IMG"):
              n = c.count(tok)
              ok(f"미치환 토큰 {tok} 없음 (실제 {n}개)", n == 0)

          imgs = len(re.findall(r"<img", c))
          ok(f"이미지 태그 {imgs}개", imgs > 0)

          # 카드에 쿠팡 광고 소재를 다시 넣지 않았는지 (2026-08 카드 재설계)
          cdn = len(re.findall(r"coupangcdn", c))
          ok(f"쿠팡 배너 이미지 미사용 (coupangcdn {cdn}개)", cdn == 0,
             "카드 재설계 이후 본문 카드에는 쿠팡 광고 소재를 넣지 않는다. "
             "맨 아래 다이나믹 캐러셀은 스크립트라 여기 안 잡힌다")

          flex = len(re.findall(r"display:\s*flex", c))
          ok(f"카드 가로 flex 미사용 ({flex}개)", flex == 0,
             "모바일에서 442px 줄바꿈을 만들던 구조")

          # --- 이 글에만 해당하는 검사 ---
          code = (os.environ.get("DEEPLINK") or "").strip()
          if code:
              print("\n[ 이 글 ]")
              n = c.count(code)
              want = int((os.environ.get("EXPECT_DEEPLINKS") or "3").strip() or 3)
              ok(f"딥링크 {code} {n}개 (기대 {want}개)", n == want,
                 "카드 제목 · 카드 CTA · 본문 인라인")
          else:
              print("\n[ 이 글 ]  deeplink_code 를 안 줘서 딥링크 검사는 건너뜀")

          marker = (os.environ.get("CARD_MARKER") or "").strip()
          if marker:
              ok(f"상품카드 표지 문구 '{marker}'", marker in c)

          # --- 발췌 ---
          needle = (os.environ.get("NEEDLE") or "").strip() or marker or code
          if needle:
              i = c.find(needle)
              print("\n=== 발췌 ===")
              if i >= 0:
                  print(c[max(0, i - 200): i + 700])
              else:
                  print(f"'{needle}' 없음")

          print()
          if fails:
              print(f"::warning::확인 필요 {len(fails)}건 — " + " / ".join(fails))
          else:
              print("전부 통과.")
          PY
