name: 지식iN 질문 본문 읽기

# 미답변 목록에서 고른 질문의 **본문 전체**를 읽어온다.
# 제목만 보고 답하면 엉뚱한 답이 나온다(실제로 겪음 — 사료 문제인 줄 알았는데 심장병이었다).
#
# docId를 콤마로 여러 개 넣을 수 있다. 답변하기 직전에 실행한다.
# ※ 읽기 전용. 답변 자동 등록은 하지 않는다(운영정책상 매크로 금지).

on:
  workflow_dispatch:
    inputs:
      doc_ids:
        description: "질문 URL 또는 docId:dirId 쌍 (콤마 구분). dirId 없으면 404 난다"
        required: true
      dir_id:
        description: "공통 dirId (쌍으로 안 줄 때만)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: 질문 본문 조회
        env:
          DOC_IDS: ${{ github.event.inputs.doc_ids }}
          DIR_ID: ${{ github.event.inputs.dir_id }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, html, requests

          raw = [x.strip() for x in (os.environ.get("DOC_IDS") or "").split(",") if x.strip()]
          common_dir = (os.environ.get("DIR_ID") or "").strip()

          def parse(tok):
              """URL / 'docId:dirId' / 'docId' 를 모두 받는다. dirId가 없으면 404가 나므로 꼭 챙긴다."""
              if "docId=" in tok:
                  doc = re.search(r"docId=(\d+)", tok)
                  dr = re.search(r"dirId=(\d+)", tok)
                  return (doc.group(1) if doc else None), (dr.group(1) if dr else common_dir)
              if ":" in tok:
                  a, b = tok.split(":", 1)
                  return a.strip(), b.strip()
              return tok, common_dir

          docs = [p for p in (parse(t) for t in raw) if p[0]]
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          H = {"User-Agent": UA, "Accept-Language": "ko-KR,ko;q=0.9"}

          def strip(s):
              s = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", s or "", flags=re.S | re.I)
              s = re.sub(r"<br\s*/?>", "\n", s, flags=re.I)
              s = re.sub(r"</p>|</div>", "\n", s, flags=re.I)
              s = re.sub(r"<[^>]+>", "", s)
              s = html.unescape(s)
              s = re.sub(r"[ \t]+", " ", s)
              return re.sub(r"\n{3,}", "\n\n", s).strip()

          for d, dr in docs:
              url = f"https://kin.naver.com/qna/detail.naver?d1id=8&docId={d}"
              if dr:
                  url += f"&dirId={dr}"
              else:
                  print("::warning::dirId가 없습니다 — 404가 날 수 있어요")
              print("=" * 66)
              print(f"docId {d}")
              print(url)
              print("=" * 66)
              try:
                  r = requests.get(url, headers=H, timeout=25)
              except Exception as e:
                  print(f"::warning::조회 실패 {type(e).__name__}"); continue
              if not r.ok:
                  print(f"::warning::HTTP {r.status_code}"); continue
              t = r.text

              mt = re.search(r'<title>(.*?)</title>', t, re.S)
              if mt:
                  ttl = html.unescape(mt.group(1)).strip()
                  ttl = re.sub(r"\s*:\s*네이버 지식iN\s*$", "", ttl)
                  print(f"[제목] {ttl}\n")

              # 본문 추출 — og:description 이 가장 안정적이다.
              # div 클래스는 템플릿마다 다르고, 페이지 뒤쪽 모달 템플릿까지 긁히는 문제가 있었다.
              def meta(prop):
                  m = re.search(
                      r'<meta[^>]+(?:property|name)=["\']' + prop + r'["\'][^>]+content=["\'](.*?)["\']',
                      t, re.S | re.I)
                  if not m:
                      m = re.search(
                          r'<meta[^>]+content=["\'](.*?)["\'][^>]+(?:property|name)=["\']' + prop + r'["\']',
                          t, re.S | re.I)
                  return html.unescape(m.group(1)).strip() if m else ""

              body = meta("og:description") or meta("description")
              body = re.sub(r"\s*\|\s*네이버 지식iN\s*$", "", body)

              print("[본문]")
              print(body if body else "(본문을 찾지 못했습니다 — 링크를 직접 열어보세요)")
              print()

              # 첨부 이미지가 있으면 알려준다 (사진 판독이 필요한 질문인지 구분)
              imgs = re.findall(r'https://kin-phinf\.pstatic\.net/\S+?\.(?:jpg|jpeg|png)', t)
              if imgs:
                  print(f"[첨부 이미지 {len(set(imgs))}장] — 사진 판독이 필요한 질문일 수 있습니다")
                  for u in list(dict.fromkeys(imgs))[:5]:
                      print("   " + u)
                  print()

              # 태그·분류
              tags = re.findall(r'<a[^>]*class="tag[^"]*"[^>]*>(.*?)</a>', t, re.S)
              if tags:
                  print("[태그] " + ", ".join(strip(x) for x in tags[:8]) + "\n")

              if not body:
                  seg = re.search(r'questionDetail(.{0,1200})', t, re.S)
                  if seg:
                      print("[원문 조각]")
                      print(strip(seg.group(1))[:900])
                      print()
          PY
