name: SEO 보강 - 제목·본문 확장 (짧은 글)

# 특정 글의 제목에 포커스 키워드를 넣고, 본문을 알맹이 있는 내용으로 확장한다.
# (길이 600단어 미만·제목 키워드 미포함 글 대상)

on:
  workflow_dispatch:
    inputs:
      post_id: { description: '대상 글 번호(ID)', required: true, default: '46' }

permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: 확장
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid = int(os.environ["POST_ID"].strip())

          NEWTITLE = {
            46: "자동급수기 추천 — 정수·소음·세척으로 고르는 기준 (2026)",
          }
          ADD = {
            46: (
              '<h2>급수기, 오래 잘 쓰는 관리 루틴</h2>\n'
              '<p>자동급수기는 사놓고 방치하면 오히려 물때·세균이 생겨 안 쓰느니만 못해요. 일주일에 한 번은 펌프를 분해해 흐르는 물에 헹구고, 칫솔로 임펠러(회전자) 틈을 닦아주세요. 필터는 제품 표기 주기(보통 2~4주)마다 갈고, 물은 자동이라도 이틀에 한 번은 새로 채워요. 물때가 잘 끼는 여름엔 주기를 더 짧게 잡는 게 좋아요.</p>\n'
              '<h2>자동급수기 추천 전에 꼭 체크할 것</h2>\n'
              '<ul>\n'
              '<li><strong>콘센트 위치</strong>: 전원이 필요한 제품이 많아, 밥그릇 근처에 콘센트가 있는지 미리 봐요.</li>\n'
              '<li><strong>소음 후기</strong>: 같은 모델도 개체차가 있어, 실사용 소음 후기를 함께 확인해요.</li>\n'
              '<li><strong>부품 수급</strong>: 필터·펌프 같은 소모품을 꾸준히 살 수 있는 제품이 오래 써요.</li>\n'
              '</ul>\n'
              '<p><strong>Q. 물을 데워주는 기능도 필요할까요?</strong><br>대부분은 실온 물로 충분해요. 특별히 찬물을 싫어하는 아이가 아니라면 굳이 필요하진 않아요.</p>\n'
              '<p><strong>Q. 하루에 물을 얼마나 마셔야 정상인가요?</strong><br>체중 1kg당 하루 50ml 안팎이 대략적인 기준이에요. 크게 벗어나면 수의사와 상담하세요.</p>\n'
            ),
          }
          marker = "급수기, 오래 잘 쓰는 관리 루틴"

          r = requests.get(f"{base}/wp-json/wp/v2/posts/{pid}", params={"context":"edit"}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::조회 실패 {r.status_code}"); raise SystemExit(1)
          c = r.json().get("content", {}).get("raw", "")
          payload = {}
          log = []

          nt = NEWTITLE.get(pid)
          if nt:
              payload["title"] = nt; log.append(f"제목→{nt}")

          add = ADD.get(pid)
          if add and marker not in c:
              # 마무리 앞에 삽입 (없으면 관련글 앞, 없으면 마지막 hr 앞)
              anchor = None
              for pat in [r'<h2[^>]*>\s*마무리\s*</h2>', r'<h2[^>]*>\s*함께 보면 좋은 글\s*</h2>', r'<hr\s*/?>']:
                  m = list(re.finditer(pat, c))
                  if m: anchor = m[-1].start() if pat==r'<hr\s*/?>' else m[0].start(); break
              if anchor is not None:
                  c = c[:anchor] + add + "\n" + c[anchor:]
              else:
                  c = c + "\n" + add
              payload["content"] = c; log.append("본문확장(+약200단어)")
          elif add:
              log.append("본문확장 스킵(이미 있음)")

          if not payload:
              print("변경 없음"); raise SystemExit(0)
          u = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}", json=payload, auth=auth, timeout=90)
          if not u.ok:
              print(f"::error::저장 실패 {u.status_code}: {u.text[:200]}"); raise SystemExit(1)
          print(f"=== #{pid} 확장 완료 ===")
          for l in log: print("  -", l)
          PY
