name: 추천 상품 삽입 (딥링크 + 광고표시 문구)

# 발행된 글에 추천 상품 HTML 블록을 삽입하고,
# 쿠팡 파트너스 링크가 들어가므로 광고표시 문구를 맨 위에 (다시) 넣는다.

on:
  workflow_dispatch:
    inputs:
      title_keyword:
        description: '이 문구가 제목에 든 글을 찾아 수정 (예: 강아지 사료)'
        required: true
      block_path:
        description: '삽입할 상품 HTML 블록 파일 경로'
        required: true
        default: 'assets/products/dogfood-royalcanin.html'
      add_disclosure:
        description: '광고표시 문구를 맨 위에 추가 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 상품 삽입
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TITLE_KEYWORD: ${{ github.event.inputs.title_keyword }}
          BLOCK_PATH: ${{ github.event.inputs.block_path }}
          ADD_DISCLOSURE: ${{ github.event.inputs.add_disclosure }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          kw = os.environ["TITLE_KEYWORD"].strip()
          add_disc = (os.environ.get("ADD_DISCLOSURE") or "true").strip().lower() == "true"
          disclosure = "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."

          with open(os.environ["BLOCK_PATH"], encoding="utf-8") as f:
              block = f.read().strip()

          r = requests.get(f"{base}/wp-json/wp/v2/posts",
              params={"per_page": 50, "status": "publish,draft", "context": "edit"}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::글 목록 조회 실패 {r.status_code}: {r.text[:200]}"); raise SystemExit(1)

          target = None
          for p in r.json():
              title = p.get("title", {}).get("rendered", "")
              if kw in title:
                  target = p; break
          if not target:
              print(f"::error::'{kw}' 제목의 글을 찾지 못함"); raise SystemExit(1)

          pid = target["id"]
          title = target.get("title", {}).get("rendered", "")
          content = target.get("content", {}).get("raw", "")
          print(f"대상 글: #{pid} {title}")

          # 1) 이미 상품 블록이 있으면 중복 삽입 방지
          if "link.coupang.com/a/fZe" in content:
              print("이미 상품 블록이 삽입되어 있어 본문은 건드리지 않습니다.")
          else:
              # 마지막 <hr> 앞(=마무리 뒤·확인일 푸터 앞)에 삽입, 없으면 끝에 추가
              m = list(re.finditer(r"<hr\s*/?>", content))
              if m:
                  pos = m[-1].start()
                  content = content[:pos] + block + "\n\n" + content[pos:]
              else:
                  content = content + "\n\n" + block

          # 2) 광고표시 문구를 맨 위에 (없을 때만)
          if add_disc and disclosure not in content:
              content = f"<p>{disclosure}</p>\n\n" + content

          u = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}",
              json={"content": content}, auth=auth, timeout=60)
          if not u.ok:
              print(f"::error::수정 실패 {u.status_code}: {u.text[:300]}"); raise SystemExit(1)
          d = u.json()
          print(f"=== 수정 완료 #{pid} ===")
          print("링크:", d.get("link"))
          PY
