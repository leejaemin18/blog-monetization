name: SEO 메타 삽입 (Rank Math 설명·포커스 키워드)

# Rank Math 스니펫(설명·포커스 키워드)을 REST로 넣고, 다시 읽어서 검증한다.
#
# 왜 이게 필요한가: 설명을 비워두면 Rank Math가 본문 첫 문장을 그대로 긁어간다.
# 우리 글은 첫 문장이 광고표시 문구라서 검색결과에 "이 포스팅은 쿠팡 파트너스…"가 뜬다.
#
# Rank Math 메타는 REST에 등록돼 있지 않을 수 있어서 세 경로를 차례로 시도한다.
# 다 실패하면 붙여넣을 문구를 출력한다(운영자 수동 입력).

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: '대상 글 번호(ID)'
        required: true
      description:
        description: 'Rank Math 설명 (검색결과 스니펫). 150자 안쪽 권장'
        required: true
      focus_keyword:
        description: '포커스 키워드'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: 메타 삽입·검증
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DESC: ${{ github.event.inputs.description }}
          FK: ${{ github.event.inputs.focus_keyword }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid = os.environ["POST_ID"].strip()
          desc = os.environ["DESC"].strip()
          fk = (os.environ.get("FK") or "").strip()

          print(f"대상 #{pid}")
          print(f"설명({len(desc)}자): {desc}")
          if fk: print(f"포커스 키워드: {fk}")
          print("-" * 60)

          meta = {"rank_math_description": desc}
          if fk: meta["rank_math_focus_keyword"] = fk

          # 경로 0 — 워드프레스 발췌문(excerpt).
          # Rank Math 기본 설명 템플릿이 %excerpt% 라서, 발췌문이 비어 있으면 본문 앞부분으로
          # 떨어진다. 우리 글은 앞부분이 광고표시 문구라 검색결과에 "쿠팡 파트너스…"가 뜬다.
          # excerpt 는 rank_math_* 와 달리 REST 에 정식 등록된 필드라 실제로 저장된다.
          ex = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}",
                             json={"excerpt": desc}, auth=auth, timeout=60)
          print(f"[excerpt] HTTP {ex.status_code}")
          if ex.ok:
              got = (ex.json().get("excerpt") or {}).get("raw", "")
              if desc[:12] in got:
                  print("   저장 확인 — 스니펫이 발췌문을 쓰게 됩니다")
              else:
                  print(f"   ::warning::발췌문 미반영: {got[:80]}")
          else:
              print("   " + ex.text[:200])

          def read_meta():
              r = requests.get(f"{base}/wp-json/wp/v2/posts/{pid}",
                               params={"context": "edit"}, auth=auth, timeout=40)
              return (r.json().get("meta") or {}) if r.ok else {}

          # 경로 1 — 표준 posts 엔드포인트의 meta
          attempts = [("posts.meta", f"{base}/wp-json/wp/v2/posts/{pid}", {"meta": meta})]
          # 경로 2 — Rank Math 자체 엔드포인트(설치본에 따라 있을 수도)
          attempts.append(("rankmath.updateMeta", f"{base}/wp-json/rankmath/v1/updateMeta",
                           {"objectID": int(pid), "objectType": "post", "meta": meta}))

          saved = ""
          for name, url, body in attempts:
              try:
                  r = requests.post(url, json=body, auth=auth, timeout=60)
                  print(f"[{name}] HTTP {r.status_code}")
                  if not r.ok:
                      print("   " + r.text[:200])
              except Exception as e:
                  print(f"[{name}] 예외 {type(e).__name__}")
                  continue
              saved = read_meta().get("rank_math_description", "") or ""
              if saved and desc[:12] in saved:
                  print(f"\n=== 저장 확인: {name} ===")
                  print(saved)
                  raise SystemExit(0)

          # 여기까지 왔으면 REST로 안 들어간 것이다.
          print("\n::warning::REST로 저장되지 않았습니다 (Rank Math 메타 미등록).")
          print("Rank Math '스니펫 편집' 에 아래를 그대로 붙여넣으세요.\n")
          print("[설명]")
          print(desc)
          if fk:
              print("\n[포커스 키워드]")
              print(fk)
          print("\n※ 편집기를 먼저 새로고침하세요. 열려 있던 탭이 방금 올린 본문을 덮어씁니다.")
          PY
