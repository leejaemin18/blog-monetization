name: SEO 본문 보강 (키워드 위치·내부/외부 링크)

# 포커스 키워드를 본문 시작부·H2·이미지 alt에 심고, 내부 링크(관련 글) +
# 외부 dofollow 권위 링크를 추가한다. Rank Math 온페이지 항목 충족용.
# (포커스 키워드 '설정' 자체는 Rank Math 박스에서 수동 — REST 불가)

on:
  workflow_dispatch:
    inputs:
      post_id: { description: '대상 글 번호(ID)', required: true, default: '25' }

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 보강
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid = int(os.environ["POST_ID"].strip())

          ALLPOSTS = [
            (25, "/dog-food-guide/", "강아지 사료 고르는 법"),
            (62, "/cat-food-guide/", "고양이 사료 고르는 법"),
            (33, "/cat-litter-guide/", "고양이 모래 고르는 법"),
            (46, "/pet-water-fountain/", "반려동물 자동급수기 고르는 법"),
            (50, "/cat-scratcher-guide/", "고양이 스크래처 고르는 법"),
          ]
          # 글별 본문 편집 규칙: (키워드, [(찾기,바꾸기)...], 외부링크 앵커텍스트, 외부URL)
          PLAN = {
            25: {"kw":"강아지 사료 추천",
                 "reps":[("강아지 사료 순위","강아지 사료 추천"),
                         ("그래서, 뭘로 시작하면 좋을까","강아지 사료 추천, 그래서 뭘로 시작할까"),
                         ('alt="ingredients"','alt="강아지 사료 추천 기준 인포그래픽"')],
                 "ext_anchor":"AAFCO", "ext_url":"https://www.aafco.org/"},
            62: {"kw":"고양이 사료 추천",
                 "reps":[("고양이 사료 코너, 진짜 끝이 없죠.","고양이 사료 추천을 찾다 보면 종류가 진짜 끝이 없죠."),
                         ("그래서, 뭘로 시작하면 좋을까","고양이 사료 추천, 그래서 뭘로 시작할까"),
                         ('alt="criteria"','alt="고양이 사료 추천 기준 인포그래픽"')],
                 "ext_anchor":"AAFCO", "ext_url":"https://www.aafco.org/"},
            33: {"kw":"고양이 모래 추천",
                 "reps":[("고양이 모래, 진짜 종류가 끝이 없죠.","고양이 모래 추천을 찾다 보면 종류가 진짜 끝이 없죠."),
                         ("그래서, 어떤 형태를 고를까","고양이 모래 추천, 어떤 종류를 고를까"),
                         ('alt="types"','alt="고양이 모래 추천 5종 비교"')],
                 "ext_anchor":None, "ext_url":None},
            46: {"kw":"자동급수기 추천",
                 "reps":[("우리 아이가 물그릇을 거의 안 비워서 걱정하신 적 있으시죠.","자동급수기 추천을 찾는 분이라면, 우리 아이가 물그릇을 안 비워서 걱정이시죠."),
                         ("그래서, 뭘로 시작하면 좋을까","자동급수기 추천, 그래서 뭘로 시작할까"),
                         ('alt="criteria"','alt="자동급수기 추천 기준"')],
                 "ext_anchor":None, "ext_url":None},
            50: {"kw":"고양이 스크래처",
                 "reps":[("소파 모서리랑 벽지가 너덜너덜해진 걸 보면","고양이 스크래처를 찾게 되는 건, 소파 모서리랑 벽지가 너덜너덜해진 걸 보면서죠. 그런 걸 보면"),
                         ("그래서, 어떤 형태를 고를까","고양이 스크래처, 어떤 형태를 고를까"),
                         ('alt="guide"','alt="고양이 스크래처 고르는 기준"')],
                 "ext_anchor":None, "ext_url":None},
          }

          p = PLAN.get(pid)
          if not p:
              print(f"::error::#{pid} 규칙 없음"); raise SystemExit(1)

          r = requests.get(f"{base}/wp-json/wp/v2/posts/{pid}", params={"context":"edit"}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::조회 실패 {r.status_code}"); raise SystemExit(1)
          c = r.json().get("content", {}).get("raw", "")
          log = []

          for find, rep in p["reps"]:
              if find in c and rep not in c:
                  c = c.replace(find, rep, 1); log.append(f"치환:{find[:14]}…")
              else:
                  log.append(f"스킵:{find[:14]}…")

          # 외부 dofollow 권위 링크 (1회)
          if p["ext_anchor"] and p["ext_url"] and p["ext_url"] not in c and p["ext_anchor"] in c:
              c = c.replace(p["ext_anchor"],
                  f'<a href="{p["ext_url"]}" target="_blank" rel="noopener">{p["ext_anchor"]}</a>', 1)
              log.append("외부링크추가")

          # 내부 링크(관련 글) — 마지막 <hr> 앞
          if "함께 보면 좋은 글" not in c:
              items = "".join(f'<li><a href="{u}">{t}</a></li>' for i,u,t in ALLPOSTS if i != pid)
              block = f'<h2>함께 보면 좋은 글</h2>\n<ul>{items}</ul>'
              import re
              m = list(re.finditer(r"<hr\s*/?>", c))
              if m:
                  pos = m[-1].start(); c = c[:pos] + block + "\n\n" + c[pos:]
              else:
                  c = c + "\n\n" + block
              log.append("내부링크추가")

          u = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}", json={"content": c}, auth=auth, timeout=90)
          if not u.ok:
              print(f"::error::저장 실패 {u.status_code}: {u.text[:200]}"); raise SystemExit(1)
          print(f"=== #{pid} 보강 완료 (키워드='{p['kw']}') ===")
          for l in log: print("  -", l)
          print("남은 수동: Rank Math 박스에 포커스 키워드 입력 →", p["kw"])
          PY
