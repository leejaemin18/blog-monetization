name: 슬러그·태그 설정 (범용)

# 특정 글의 슬러그(짧은 영문)와 태그를 설정한다. 신규 발행 글 마무리용.

on:
  workflow_dispatch:
    inputs:
      post_id: { description: '대상 글 번호(ID)', required: true }
      slug: { description: '슬러그. 새 글은 한글(포커스 키워드, 예: 강아지-귀-청소), 에셋 키는 영문 유지. 저장값 echo 확인', required: false, default: '' }
      tags: { description: '태그(콤마 구분)', required: false, default: '' }
      category: { description: '카테고리 이름(정확히)', required: false, default: '' }
      create_category: { description: '카테고리가 없으면 새로 만들기 (y/n)', required: false, default: 'n' }
      category_slug: { description: '새 카테고리의 영문 슬러그 (선택)', required: false, default: '' }

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: 설정
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
          SLUG: ${{ github.event.inputs.slug }}
          TAGS: ${{ github.event.inputs.tags }}
          CATEGORY: ${{ github.event.inputs.category }}
          CREATE_CATEGORY: ${{ github.event.inputs.create_category }}
          CATEGORY_SLUG: ${{ github.event.inputs.category_slug }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid = os.environ["POST_ID"].strip()
          slug = os.environ["SLUG"].strip()
          tags = [t.strip() for t in (os.environ.get("TAGS") or "").split(",") if t.strip()]
          cat = (os.environ.get("CATEGORY") or "").strip()

          def tag_id(name):
              r = requests.post(f"{base}/wp-json/wp/v2/tags", json={"name": name}, auth=auth, timeout=30)
              if r.status_code in (200,201): return r.json()["id"]
              if r.status_code == 400:
                  tid = (r.json().get("data") or {}).get("term_id")
                  if tid: return tid
              rs = requests.get(f"{base}/wp-json/wp/v2/tags", params={"search": name, "per_page":50}, auth=auth, timeout=30)
              if rs.ok:
                  for t in rs.json():
                      if t["name"] == name: return t["id"]
              print(f"::warning::태그 실패: {name}"); return None

          payload = {}
          if slug:
              payload["slug"] = slug
          if tags:
              ids = [t for t in (tag_id(n) for n in tags) if t]
              payload["tags"] = ids
          if cat:
              rc = requests.get(f"{base}/wp-json/wp/v2/categories",
                                params={"search": cat, "per_page": 50}, auth=auth, timeout=30)
              cid = None
              if rc.ok:
                  for c in rc.json():
                      if c["name"] == cat: cid = c["id"]; break
              if not cid and (os.environ.get("CREATE_CATEGORY") or "").lower().startswith("y"):
                  body = {"name": cat}
                  cslug = (os.environ.get("CATEGORY_SLUG") or "").strip()
                  if cslug:
                      body["slug"] = cslug
                  rn = requests.post(f"{base}/wp-json/wp/v2/categories", json=body, auth=auth, timeout=30)
                  if rn.status_code in (200, 201):
                      cid = rn.json()["id"]
                      print(f"카테고리 생성: {cat} (id={cid})")
                  elif rn.status_code == 400:
                      cid = (rn.json().get("data") or {}).get("term_id")
                      if cid:
                          print(f"카테고리 기존 사용: {cat} (id={cid})")
                  if not cid:
                      print(f"::warning::카테고리 생성 실패: {rn.status_code} {rn.text[:150]}")
              if cid:
                  payload["categories"] = [cid]
              else:
                  print(f"::warning::카테고리를 찾지 못했습니다: {cat} (새로 만들려면 create_category=y)")
          if not payload:
              print("::error::변경할 값이 없습니다(slug/tags/category 중 하나는 필요)"); raise SystemExit(1)
          u = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}", json=payload, auth=auth, timeout=60)
          if not u.ok:
              print(f"::error::저장 실패 {u.status_code}: {u.text[:200]}"); raise SystemExit(1)
          j = u.json()
          print(f"=== #{pid} slug={j.get('slug')} tags={len(j.get('tags',[]))}개 cats={j.get('categories')} ===")
          PY
