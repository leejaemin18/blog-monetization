name: 워드프레스 자동발행 (초안 업로드)

# 저장소의 마크다운 초안을 워드프레스에 REST API로 올린다.
# 안전장치:
#   - 기본 status=draft (사이트에 "임시글"로 들어감) → 사람이 딥링크·이미지 확인 후 발행
#   - status=publish 는 명시적으로 선택했을 때만
#
# 1회 설정 (시크릿 3개):
#   워드프레스 관리자 → 사용자 → 프로필 → "애플리케이션 비밀번호" 새로 발급 후,
#   저장소 Settings → Secrets and variables → Actions 에 추가:
#     WP_URL          예: https://jipsa.jaylog.co.kr
#     WP_USER         워드프레스 로그인 아이디
#     WP_APP_PASSWORD 애플리케이션 비밀번호 (관리자 비번 아님!)
#
# 실행: Actions 탭 → 이 워크플로우 → Run workflow → 초안 경로 입력

on:
  workflow_dispatch:
    inputs:
      draft_path:
        description: "올릴 초안 경로 (예: drafts/예시-강아지-사료-고르는법.md)"
        required: true
      category:
        description: "카테고리 슬러그 (food/goods/gadget/guide)"
        required: false
        default: "food"
      status:
        description: "draft(임시글, 권장) 또는 publish"
        required: false
        default: "draft"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 마크다운 → HTML 변환 후 업로드
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
          CATEGORY: ${{ github.event.inputs.category }}
          POST_STATUS: ${{ github.event.inputs.status }}
        run: |
          set -e
          if [ -z "$WP_URL" ] || [ -z "$WP_USER" ] || [ -z "$WP_APP_PASSWORD" ]; then
            echo "::error::WP_URL / WP_USER / WP_APP_PASSWORD 시크릿을 먼저 등록하세요."
            exit 1
          fi
          if [ ! -f "$DRAFT_PATH" ]; then
            echo "::error::초안 파일이 없습니다: $DRAFT_PATH"; exit 1
          fi
          pip -q install markdown requests

          # ── 인증 자가진단: 이 자격증명이 실제로 어느 사용자로 인식되는지 확인 ──
          python3 - <<'DIAG'
          import os, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          r = requests.get(f"{base}/wp-json/wp/v2/users/me", params={"context": "edit"}, auth=auth, timeout=30)
          print(f"[진단] users/me → HTTP {r.status_code}")
          body = r.text[:300]
          print(f"[진단] 응답: {body}")
          if r.status_code == 401:
              # Authorization 헤더가 서버에 도달하는지 확인 (rest_route 우회 경로도 시도)
              r2 = requests.get(f"{base}/?rest_route=/wp/v2/users/me&context=edit", auth=auth, timeout=30)
              print(f"[진단] rest_route 우회 → HTTP {r2.status_code}: {r2.text[:200]}")
          DIAG

          python3 - <<'PY'
          import os, re, json, requests, markdown

          path = os.environ["DRAFT_PATH"]
          raw = open(path, encoding="utf-8").read()

          # HTML 주석(작업 메모·이미지 브리프)은 발행본에서 제거
          body = re.sub(r"<!--.*?-->", "", raw, flags=re.S)

          # 첫 번째 # 제목 추출
          m = re.search(r"^#\s+(.+)$", body, flags=re.M)
          title = m.group(1).strip() if m else os.path.basename(path)
          if m:
              body = body.replace(m.group(0), "", 1)

          html = markdown.markdown(body, extensions=["tables", "nl2br"])

          base = os.environ["WP_URL"].rstrip("/")
          # 앱 비밀번호의 공백은 제거해도 유효 — 복붙 실수 방지
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))

          # 카테고리 슬러그 → ID 조회 (없으면 미분류)
          cat_ids = []
          slug = os.environ.get("CATEGORY", "").strip()
          if slug:
              r = requests.get(f"{base}/wp-json/wp/v2/categories", params={"slug": slug}, auth=auth, timeout=30)
              if r.ok and r.json():
                  cat_ids = [r.json()[0]["id"]]
              else:
                  print(f"::warning::카테고리 슬러그 '{slug}' 를 찾지 못해 기본 카테고리로 올립니다.")

          status_ = os.environ.get("POST_STATUS", "draft")
          payload = {"title": title, "content": html, "status": status_}
          if cat_ids:
              payload["categories"] = cat_ids

          r = requests.post(f"{base}/wp-json/wp/v2/posts", json=payload, auth=auth, timeout=60)
          if r.ok:
              post = r.json()
              print("=== 업로드 성공 (REST) ===")
              print("제목:", post.get("title", {}).get("rendered"))
              print("상태:", post.get("status"))
              print("편집 주소:", f"{base}/wp-admin/post.php?post={post.get('id')}&action=edit")
              print("링크:", post.get("link"))
              raise SystemExit(0)

          print(f"REST 실패 {r.status_code} → XML-RPC로 재시도 (헤더 스트리핑 우회)")

          # ── 폴백: XML-RPC — 인증이 헤더가 아닌 본문에 담겨 CDN이 제거하지 못함 ──
          import xmlrpc.client
          srv = xmlrpc.client.ServerProxy(f"{base}/xmlrpc.php")
          user, pwd = auth
          content = {"post_type": "post", "post_status": status_,
                     "post_title": title, "post_content": html}
          if slug:
              try:
                  terms = srv.wp.getTerms(0, user, pwd, "category")
                  match = [t for t in terms if t.get("slug") == slug]
                  if match:
                      content["terms"] = {"category": [int(match[0]["term_id"])]}
                  else:
                      print(f"카테고리 '{slug}' 없음 — 기본 카테고리로.")
              except Exception as e:
                  print("카테고리 조회 실패(무시):", e)
          try:
              post_id = srv.wp.newPost(0, user, pwd, content)
          except xmlrpc.client.Fault as e:
              print(f"::error::XML-RPC도 실패: {e.faultCode} {e.faultString[:200]}")
              print("::error::호스팅이 REST 인증 헤더와 xmlrpc.php를 모두 막고 있습니다. 호스팅 설정(Authorization 헤더 전달 또는 XML-RPC 허용)이 필요합니다.")
              raise SystemExit(1)
          print("=== 업로드 성공 (XML-RPC) ===")
          print("제목:", title)
          print("상태:", status_)
          print("편집 주소:", f"{base}/wp-admin/post.php?post={post_id}&action=edit")
          PY
