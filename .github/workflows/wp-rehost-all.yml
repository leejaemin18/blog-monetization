name: 글 내 모든 쿠팡 배너 이미지 재호스팅

# 특정 글 본문의 외부 쿠팡 배너 이미지(coupangcdn affiliate/banner)를 모두
# 워드프레스 미디어로 옮기고 로컬 주소로 교체한다. (딥링크는 유지)

on:
  workflow_dispatch:
    inputs:
      post_id: { description: '대상 글 번호(ID)', required: true }
      prefix: { description: '업로드 파일명 접두어', required: false, default: 'coupang-banner' }

permissions:
  contents: read

jobs:
  rehost:
    runs-on: ubuntu-latest
    steps:
      - name: 전체 재호스팅
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
          PREFIX: ${{ github.event.inputs.prefix }}
        run: |
          pip -q install requests
          python3 - <<'PY'
          import os, re, requests
          base = os.environ["WP_URL"].rstrip("/")
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"].replace(" ", ""))
          pid = os.environ["POST_ID"].strip()
          prefix = os.environ.get("PREFIX") or "coupang-banner"

          r = requests.get(f"{base}/wp-json/wp/v2/posts/{pid}", params={"context": "edit"}, auth=auth, timeout=60)
          if not r.ok:
              print(f"::error::글 조회 실패 {r.status_code}"); raise SystemExit(1)
          c = r.json().get("content", {}).get("raw", "")

          # 외부 쿠팡 배너 이미지 URL 모두 추출 (coupangcdn.com/image/affiliate/banner/...)
          urls = re.findall(r'https://[a-zA-Z0-9.\-]*coupangcdn\.com/image/affiliate/banner/[^"\'\s)]+', c)
          urls = list(dict.fromkeys(urls))  # 중복 제거·순서 유지
          print(f"발견한 외부 배너 이미지: {len(urls)}개")

          n = 0
          for i, u in enumerate(urls, 1):
              ir = requests.get(u, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://link.coupang.com/"}, timeout=60)
              if not ir.ok:
                  print(f"::warning::다운로드 실패({ir.status_code}): {u[:80]}"); continue
              ctype = ir.headers.get("Content-Type", "image/jpeg").split(";")[0]
              ext = {"image/png": "png", "image/jpeg": "jpg", "image/webp": "webp"}.get(ctype, "jpg")
              fn = f"{prefix}-{pid}-{i}.{ext}"
              mr = requests.post(f"{base}/wp-json/wp/v2/media",
                  headers={"Content-Type": ctype, "Content-Disposition": f'attachment; filename="{fn}"'},
                  data=ir.content, auth=auth, timeout=120)
              if not mr.ok:
                  print(f"::warning::업로드 실패({mr.status_code}): {mr.text[:120]}"); continue
              local = mr.json()["source_url"]
              c = c.replace(u, local); n += 1
              print(f"  {i}. {ctype} {len(ir.content)}B → {local.split('/')[-1]}")

          if n == 0:
              print("교체할 외부 배너 없음 (이미 재호스팅되었거나 배너 이미지 없음)"); raise SystemExit(0)
          up = requests.post(f"{base}/wp-json/wp/v2/posts/{pid}", json={"content": c}, auth=auth, timeout=90)
          if not up.ok:
              print(f"::error::수정 실패 {up.status_code}: {up.text[:200]}"); raise SystemExit(1)
          left = len(re.findall(r'coupangcdn\.com/image/affiliate/banner', up.json().get("content", {}).get("raw", "")))
          print(f"=== #{pid} 재호스팅 완료: {n}개 교체 · 남은 외부배너 {left}개 ===")
          PY
