<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#FFFCF7"/>
  <text x="50" y="48" font-size="25" font-weight="800" fill="#33302B">고양이는 하루에 두 번 폭발합니다</text>
  <text x="50" y="76" font-size="13.5" fill="#8A8378">새벽과 해질녘, 짧고 강하게 — 실내에선 그 봉우리가 눌립니다</text>

  <!-- 범례 -->
  <rect x="632" y="88" width="318" height="60" rx="10" fill="#FFFFFF" stroke="#EAE3D8" stroke-width="1.4"/>
  <line x1="648" y1="110" x2="686" y2="110" stroke="#2F9C95" stroke-width="4"/>
  <text x="696" y="115" font-size="13.5" font-weight="700" fill="#33302B">야생의 하루 리듬</text>
  <line x1="648" y1="132" x2="686" y2="132" stroke="#E8825A" stroke-width="3.5" stroke-dasharray="7 5"/>
  <text x="696" y="137" font-size="13.5" font-weight="700" fill="#33302B">실내 고양이</text>

  <!-- 축 -->
  <line x1="120" y1="460" x2="920" y2="460" stroke="#C9C1B4" stroke-width="2"/>
  <text x="112" y="168" font-size="12.5" fill="#8A8378" text-anchor="end">많음</text>
  <text x="112" y="452" font-size="12.5" fill="#8A8378" text-anchor="end">적음</text>
  <text x="120" y="484" font-size="12.5" fill="#8A8378" text-anchor="middle">자정</text>
  <text x="320" y="484" font-size="12.5" fill="#8A8378" text-anchor="middle">새벽</text>
  <text x="520" y="484" font-size="12.5" fill="#8A8378" text-anchor="middle">정오</text>
  <text x="720" y="484" font-size="12.5" fill="#8A8378" text-anchor="middle">해질녘</text>
  <text x="920" y="484" font-size="12.5" fill="#8A8378" text-anchor="middle">자정</text>

  <!-- 야생 곡선 아래 옅은 면 -->
  <polygon points="120,410 220,432 287,300 320,160 387,350 487,422 587,410 687,300 720,150 787,330 853,392 920,408 920,460 120,460"
           fill="#2F9C95" fill-opacity="0.10"/>

  <!-- 실내 곡선 (점선) -->
  <polyline points="120,420 220,432 287,392 320,320 387,388 487,400 587,396 687,352 720,300 787,378 853,410 920,420"
            fill="none" stroke="#E8825A" stroke-width="3.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 야생 곡선 -->
  <polyline points="120,410 220,432 287,300 320,160 387,350 487,422 587,410 687,300 720,150 787,330 853,392 920,408"
            fill="none" stroke="#2F9C95" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 봉우리 표시 -->
  <circle cx="320" cy="160" r="5.5" fill="#2F9C95"/>
  <circle cx="720" cy="150" r="5.5" fill="#2F9C95"/>
  <text x="320" y="140" font-size="14" font-weight="800" fill="#1F6E69" text-anchor="middle">새벽 사냥</text>
  <text x="720" y="130" font-size="14" font-weight="800" fill="#1F6E69" text-anchor="middle">해질녘 사냥</text>

  <!-- 눌린 차이 표시 -->
  <line x1="760" y1="160" x2="760" y2="292" stroke="#C4562B" stroke-width="1.6" stroke-dasharray="4 4"/>
  <polygon points="760,160 755,170 765,170" fill="#C4562B"/>
  <polygon points="760,292 755,282 765,282" fill="#C4562B"/>
  <text x="772" y="230" font-size="13" font-weight="700" fill="#C4562B">갈 곳 없는</text>
  <text x="772" y="248" font-size="13" font-weight="700" fill="#C4562B">활동 에너지</text>

  <!-- 하단 배너 -->
  <rect x="120" y="520" width="760" height="46" rx="11" fill="#2F9C95"/>
  <text x="500" y="549" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">새벽·해질녘의 우다다를 받아 줄 거리가 실내엔 없어요</text>
</svg>
