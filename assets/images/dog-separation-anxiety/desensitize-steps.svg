<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="Noto Sans KR, sans-serif">
<rect x="0" y="0" width="1240" height="820" fill="#FBF8F2"/>
<text x="70" y="86" font-size="46" font-weight="700" fill="#4a4038">혼자 두는 시간, 계단처럼 조금씩</text>
<rect x="70" y="570" width="250" height="170" rx="16" ry="16" fill="#EADFCB"/>
<circle cx="195" cy="628" r="34" fill="#C08A5E"/>
<text x="195" y="641" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="195" y="700" font-size="40" font-weight="700" fill="#4a4038" text-anchor="middle">몇 초</text>
<text x="195" y="744" font-size="25" fill="#8a8378" text-anchor="middle">문 닫고 곧 돌아오기</text>
<rect x="360" y="450" width="250" height="290" rx="16" ry="16" fill="#EADFCB"/>
<circle cx="485" cy="508" r="34" fill="#C08A5E"/>
<text x="485" y="521" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="485" y="580" font-size="40" font-weight="700" fill="#4a4038" text-anchor="middle">몇십 초</text>
<text x="485" y="624" font-size="25" fill="#8a8378" text-anchor="middle">조금씩 늘리기</text>
<rect x="650" y="330" width="250" height="410" rx="16" ry="16" fill="#EADFCB"/>
<circle cx="775" cy="388" r="34" fill="#C08A5E"/>
<text x="775" y="401" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="775" y="460" font-size="40" font-weight="700" fill="#4a4038" text-anchor="middle">몇 분</text>
<text x="775" y="504" font-size="25" fill="#8a8378" text-anchor="middle">담담하게 인사</text>
<rect x="940" y="210" width="250" height="530" rx="16" ry="16" fill="#EADFCB"/>
<circle cx="1065" cy="268" r="34" fill="#C08A5E"/>
<text x="1065" y="281" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1065" y="340" font-size="40" font-weight="700" fill="#4a4038" text-anchor="middle">그 이상</text>
<text x="1065" y="384" font-size="25" fill="#8a8378" text-anchor="middle">편안해지면</text>
<text x="1184" y="192" font-size="40" fill="#C08A5E" text-anchor="end">↗</text>
<text x="70" y="796" font-size="28" fill="#8a8378">나갈 때·들어올 때는 담담하게, 아이가 불안해하기 전에 돌아오기</text>
</svg>
