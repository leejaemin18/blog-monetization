    <g fill="#2F9C95"><ellipse cx="26" cy="30" rx="8" ry="6"/><circle cx="18" cy="22" r="3.4"/><circle cx="23" cy="18" r="3.4"/><circle cx="29" cy="18" r="3.4"/><circle cx="34" cy="22" r="3.4"/></g>
