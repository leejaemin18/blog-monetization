<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <rect width="1200" height="675" fill="#FFFCF7"/>
