<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <rect width="1000" height="700" fill="#FFFCF7"/>
  <text x="60" y="80" font-size="40" font-weight="800" fill="#33302B">빗은 <tspan fill="#2F9C95">종류마다 하는 일</tspan>이 달라요</text>
  <rect x="62" y="98" width="90" height="8" rx="4" fill="#E8825A"/>
  <text x="62" y="136" font-size="19" fill="#8A8378">하나로 다 하려니 안 되는 거예요. 우리 아이 털 길이에 맞는 걸 먼저 고르세요.</text>

  <!-- card 1 -->
  <rect x="60" y="170" width="430" height="230" rx="16" fill="#fff" stroke="#EAE3D8" stroke-width="2"/>
  <circle cx="112" cy="222" r="26" fill="#2F9C95"/>
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round">
    <line x1="99" y1="214" x2="99" y2="232"/><line x1="106" y1="212" x2="106" y2="232"/>
    <line x1="113" y1="211" x2="113" y2="232"/><line x1="120" y1="212" x2="120" y2="232"/>
    <line x1="127" y1="214" x2="127" y2="232"/>
  </g>
  <text x="156" y="216" font-size="25" font-weight="800" fill="#33302B">슬리커 브러시</text>
  <text x="156" y="248" font-size="19" fill="#8A8378">촘촘한 철핀 · 가장 기본</text>
  <text x="92" y="292" font-size="19" fill="#5b554d">· 죽은 속털과 엉킴을 빗어냄</text>
  <text x="92" y="324" font-size="19" fill="#5b554d">· 장모·중모종에 특히 효과</text>
  <text x="92" y="356" font-size="19" fill="#C6553A">· 힘주면 피부가 긁혀요 — 가볍게</text>

  <!-- card 2 -->
  <rect x="510" y="170" width="430" height="230" rx="16" fill="#fff" stroke="#EAE3D8" stroke-width="2"/>
  <circle cx="562" cy="222" r="26" fill="#E8825A"/>
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round">
    <line x1="549" y1="232" x2="575" y2="232"/>
    <line x1="551" y1="232" x2="551" y2="216"/><line x1="558" y1="232" x2="558" y2="216"/>
    <line x1="565" y1="232" x2="565" y2="216"/><line x1="572" y1="232" x2="572" y2="216"/>
  </g>
  <text x="606" y="216" font-size="25" font-weight="800" fill="#33302B">고무 · 실리콘 빗</text>
  <text x="606" y="248" font-size="19" fill="#8A8378">부드러움 · 단모종용</text>
  <text x="542" y="292" font-size="19" fill="#5b554d">· 짧은 털을 훑어 모아줌</text>
  <text x="542" y="324" font-size="19" fill="#5b554d">· 목욕할 때도 쓸 수 있어요</text>
  <text x="542" y="356" font-size="19" fill="#2F9C95">· 자극이 적어 겁 많은 아이에게</text>

  <!-- card 3 -->
  <rect x="60" y="424" width="430" height="230" rx="16" fill="#fff" stroke="#EAE3D8" stroke-width="2"/>
  <circle cx="112" cy="476" r="26" fill="#E8825A"/>
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round">
    <line x1="98" y1="470" x2="126" y2="470"/><line x1="98" y1="482" x2="126" y2="482"/>
  </g>
  <text x="156" y="470" font-size="25" font-weight="800" fill="#33302B">언더코트 제거기</text>
  <text x="156" y="502" font-size="19" fill="#8A8378">속털 전용 · 털갈이철 강력</text>
  <text x="92" y="546" font-size="19" fill="#5b554d">· 이중모(포메·시바·웰시) 속털에</text>
  <text x="92" y="578" font-size="19" fill="#5b554d">· 털갈이철에만 짧게 사용</text>
  <text x="92" y="610" font-size="19" fill="#C6553A">· 자주 쓰면 겉털까지 잘려요</text>

  <!-- card 4 -->
  <rect x="510" y="424" width="430" height="230" rx="16" fill="#fff" stroke="#EAE3D8" stroke-width="2"/>
  <circle cx="562" cy="476" r="26" fill="#2F9C95"/>
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round">
    <line x1="551" y1="464" x2="551" y2="488"/><line x1="562" y1="464" x2="562" y2="488"/>
    <line x1="573" y1="464" x2="573" y2="488"/>
  </g>
  <text x="606" y="470" font-size="25" font-weight="800" fill="#33302B">빗살 빗(콤)</text>
  <text x="606" y="502" font-size="19" fill="#8A8378">마무리 점검용</text>
  <text x="542" y="546" font-size="19" fill="#5b554d">· 남은 엉킴을 찾아냄</text>
  <text x="542" y="578" font-size="19" fill="#5b554d">· 귀 뒤·겨드랑이·사타구니 확인</text>
  <text x="542" y="610" font-size="19" fill="#2F9C95">· 걸림 없이 지나가면 완료</text>
</svg>
