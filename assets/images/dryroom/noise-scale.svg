<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <defs>
    <linearGradient id="noise" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F9C95"/>
      <stop offset="0.55" stop-color="#7FB86A"/>
      <stop offset="0.78" stop-color="#E8B45A"/>
      <stop offset="1" stop-color="#E8825A"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="720" fill="#FFFCF7"/>

  <text x="60" y="72" font-size="38" font-weight="800" fill="#33302B">드라이룸 소음, 숫자를 <tspan fill="#2F9C95">귀로 옮기면</tspan></text>
  <rect x="62" y="90" width="90" height="8" rx="4" fill="#E8825A"/>
  <text x="62" y="128" font-size="18" fill="#8A8378">스펙표의 dB는 체감이 안 잡힙니다. 생활 소음 위에 얹어보면 감이 옵니다.</text>

  <!-- 적응 난이도 구간 -->
  <rect x="110" y="164" width="474" height="46" rx="10" fill="#EAF5F4" stroke="#2F9C95" stroke-width="2"/>
  <text x="347" y="194" font-size="18" font-weight="700" fill="#217B75" text-anchor="middle">대부분 며칠이면 적응</text>

  <rect x="592" y="164" width="150" height="46" rx="10" fill="#FBF1DE" stroke="#E8B45A" stroke-width="2"/>
  <text x="667" y="194" font-size="17" font-weight="700" fill="#A9711A" text-anchor="middle">훈련 1~2주</text>

  <rect x="750" y="164" width="190" height="46" rx="10" fill="#FBE9E8" stroke="#E8825A" stroke-width="2"/>
  <text x="845" y="187" font-size="16" font-weight="700" fill="#B3403C" text-anchor="middle">세기 조절 없으면</text>
  <text x="845" y="206" font-size="16" font-weight="700" fill="#B3403C" text-anchor="middle">그 자리에서 실패</text>

  <!-- 눈금자 -->
  <rect x="110" y="252" width="790" height="26" rx="13" fill="url(#noise)"/>
  <text x="110" y="240" font-size="15" fill="#8A8378">조용</text>
  <text x="900" y="240" font-size="15" fill="#8A8378" text-anchor="end">시끄러움</text>

  <!-- 눈금 -->
  <g stroke="#33302B" stroke-width="2">
    <line x1="110" y1="278" x2="110" y2="298"/>
    <line x1="268" y1="278" x2="268" y2="298"/>
    <line x1="426" y1="278" x2="426" y2="298"/>
    <line x1="584" y1="278" x2="584" y2="298"/>
    <line x1="742" y1="278" x2="742" y2="298"/>
    <line x1="900" y1="278" x2="900" y2="298"/>
  </g>
  <g font-size="17" font-weight="700" fill="#33302B" text-anchor="middle">
    <text x="110" y="320">30dB</text>
    <text x="268" y="320">40dB</text>
    <text x="426" y="320">50dB</text>
    <text x="584" y="320">60dB</text>
    <text x="742" y="320">70dB</text>
    <text x="900" y="320">80dB</text>
  </g>
  <g font-size="16" fill="#5f5a53" text-anchor="middle">
    <text x="110" y="348">조용한 침실</text>
    <text x="268" y="348">냉장고 소리</text>
    <text x="426" y="348">조용한 사무실</text>
    <text x="584" y="348">마주 앉은 대화</text>
    <text x="742" y="348">TV 켜둔 거실</text>
    <text x="900" y="348">헤어드라이어</text>
  </g>

  <!-- 제품 표기값 자리 -->
  <rect x="110" y="386" width="790" height="72" rx="12" fill="#FFF4EE" stroke="#E8825A" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="140" y="418" font-size="20" font-weight="800" fill="#B3403C">펫 드라이룸 표기값</text>
  <text x="140" y="446" font-size="17" fill="#8A5A4A">(확인 후 기입) — 모델마다 달라 상세페이지에서 확인하고 위 눈금에 얹어보세요</text>

  <!-- 소리의 결 -->
  <text x="60" y="508" font-size="21" font-weight="800" fill="#33302B">같은 숫자라도 다르게 들립니다</text>
  <rect x="62" y="518" width="50" height="5" rx="2" fill="#2F9C95"/>

  <rect x="60" y="540" width="430" height="112" rx="14" fill="#EAF5F4" stroke="#2F9C95" stroke-width="2"/>
  <circle cx="106" cy="580" r="18" fill="#2F9C95"/>
  <text x="140" y="578" font-size="19" font-weight="700" fill="#217B75">낮게 깔리는 송풍음</text>
  <text x="140" y="608" font-size="16" fill="#3E8A84">바람 소리에 가까워 비교적 빨리 적응합니다</text>
  <text x="140" y="632" font-size="16" fill="#3E8A84">숫자가 조금 커도 견딜 만해요</text>

  <rect x="510" y="540" width="430" height="112" rx="14" fill="#FBE9E8" stroke="#E8825A" stroke-width="2"/>
  <circle cx="556" cy="580" r="18" fill="#C24A46"/>
  <text x="590" y="578" font-size="19" font-weight="700" fill="#B3403C">모터의 날카로운 고주파</text>
  <text x="590" y="608" font-size="16" fill="#8A5A4A">숫자가 작아도 아이가 먼저 도망갑니다</text>
  <text x="590" y="632" font-size="16" fill="#8A5A4A">세기 단계가 나뉜 모델을 고르세요</text>

  <text x="60" y="688" font-size="14" fill="#9a938a">생활 소음 위치는 일반적으로 통용되는 대략치입니다 · 제품 표기 dB는 측정 조건에 따라 달라집니다</text>
  <text x="60" y="710" font-size="14" fill="#9a938a">집사의 발견 · jipsa.jaylog.co.kr</text>
</svg>
