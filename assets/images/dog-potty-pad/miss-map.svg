<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#FFFCF7"/>
  <text x="50" y="48" font-size="25" font-weight="800" fill="#33302B">패드 밖 실수, 어디서 어긋나는가</text>
  <text x="50" y="76" font-size="13.5" fill="#8A8378">실수가 나는 자리마다 원인이 다릅니다 — 개수를 늘리는 문제가 아니에요</text>

  <!-- 패드 -->
  <rect x="70" y="170" width="380" height="300" rx="10" fill="#F5F1E9" stroke="#EAE3D8" stroke-width="2"/>
  <rect x="108" y="206" width="304" height="228" rx="8" fill="none" stroke="#C9C1B4" stroke-width="1.6" stroke-dasharray="6 6"/>
  <text x="260" y="197" font-size="12.5" fill="#8A8378" text-anchor="middle">배변패드</text>

  <!-- 가운데 젖은 자국 -->
  <ellipse cx="260" cy="320" rx="52" ry="40" fill="#2F9C95" fill-opacity="0.14"/>

  <!-- 개 발자국(윗면, 옅게) -->
  <ellipse cx="238" cy="300" rx="9" ry="12" fill="#C9C1B4"/>
  <ellipse cx="284" cy="300" rx="9" ry="12" fill="#C9C1B4"/>
  <ellipse cx="232" cy="392" rx="9" ry="12" fill="#C9C1B4"/>
  <ellipse cx="290" cy="392" rx="9" ry="12" fill="#C9C1B4"/>

  <!-- 지점 마커 -->
  <circle cx="260" cy="462" r="15" fill="#E8825A"/><text x="260" y="467" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <circle cx="80" cy="330" r="15" fill="#E8825A"/><text x="80" y="335" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <circle cx="440" cy="452" r="15" fill="#E8825A"/><text x="440" y="457" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  <circle cx="260" cy="320" r="15" fill="#E8825A"/><text x="260" y="325" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text>

  <!-- 오른쪽 설명 -->
  <g>
    <circle cx="512" cy="176" r="13" fill="#E8825A"/><text x="512" y="181" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="536" y="173" font-size="16.5" font-weight="800" fill="#33302B">뒷부분이 패드 밖으로</text>
    <text x="536" y="196" font-size="13.5" fill="#8A8378">패드가 개 몸에 비해 작다 → 몸길이의 1.5배 크기로</text>
  </g>
  <g>
    <circle cx="512" cy="252" r="13" fill="#E8825A"/><text x="512" y="257" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="536" y="249" font-size="16.5" font-weight="800" fill="#33302B">급히 눠서 옆으로 새기</text>
    <text x="536" y="272" font-size="13.5" fill="#8A8378">자리가 불안하거나 사람 동선 위 → 조용한 구석으로</text>
  </g>
  <g>
    <circle cx="512" cy="328" r="13" fill="#E8825A"/><text x="512" y="333" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="536" y="325" font-size="16.5" font-weight="800" fill="#33302B">밟으면 밀리고 접힘</text>
    <text x="536" y="348" font-size="13.5" fill="#8A8378">패드가 고정되지 않는다 → 트레이·미끄럼 방지</text>
  </g>
  <g>
    <circle cx="512" cy="404" r="13" fill="#E8825A"/><text x="512" y="409" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <text x="536" y="401" font-size="16.5" font-weight="800" fill="#33302B">젖은 자리를 피해 가장자리</text>
    <text x="536" y="424" font-size="13.5" fill="#8A8378">흡수가 약하거나 오래 방치 → 흡수 좋은 패드로 자주 교체</text>
  </g>

  <!-- 하단 배너 -->
  <rect x="512" y="452" width="440" height="46" rx="11" fill="#2F9C95"/>
  <text x="732" y="481" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">개수를 늘리기 전에 자리·크기·고정·흡수부터</text>
</svg>
