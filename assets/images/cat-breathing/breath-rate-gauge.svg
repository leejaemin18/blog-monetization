<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1000" height="640" fill="#FFFCF7"/>

  <text x="56" y="58" font-size="33" font-weight="800" fill="#33302B">잘 때 숨을 세면 기준선이 생깁니다</text>
  <rect x="56" y="72" width="92" height="7" rx="3.5" fill="#E8825A"/>
  <text x="58" y="112" font-size="18" fill="#8A8378">가슴이 한 번 올라갔다 내려오면 한 번. 15초 세고 ×4 하면 1분치입니다.</text>

  <!-- 반원 게이지 -->
  <g transform="translate(340,400)">
    <!-- 눈금 배경 아크 (반원, 반지름 240) -->
    <path d="M -240 0 A 240 240 0 0 1 240 0" fill="none" stroke="#EAE3D8" stroke-width="34" stroke-linecap="butt"/>
    <!-- 정상 구간 0~30 (180°~90°) 초록 -->
    <path d="M -240 0 A 240 240 0 0 1 0 -240" fill="none" stroke="#2F9C95" stroke-width="34"/>
    <!-- 주의 구간 30~40 (90°~60°) 노랑 -->
    <path d="M 0 -240 A 240 240 0 0 1 120 -207.85" fill="none" stroke="#D9A441" stroke-width="34"/>
    <!-- 위험 구간 40~60 (60°~0°) 코랄 -->
    <path d="M 120 -207.85 A 240 240 0 0 1 240 0" fill="none" stroke="#E8825A" stroke-width="34"/>

    <!-- 눈금 숫자 -->
    <text x="-240" y="34" font-size="17" font-weight="700" fill="#5b554d" text-anchor="middle">0</text>
    <text x="-170" y="-150" font-size="17" font-weight="700" fill="#1F6E69" text-anchor="middle">15</text>
    <text x="0" y="-262" font-size="17" font-weight="700" fill="#1F6E69" text-anchor="middle">30</text>
    <text x="128" y="-232" font-size="17" font-weight="700" fill="#9a7420" text-anchor="middle">40</text>
    <text x="240" y="34" font-size="17" font-weight="700" fill="#C4562B" text-anchor="middle">60</text>

    <!-- 구간 라벨 -->
    <text x="-150" y="-70" font-size="18" font-weight="800" fill="#1F6E69" text-anchor="middle">정상 범위</text>
    <text x="-150" y="-46" font-size="13.5" fill="#2F9C95" text-anchor="middle">대개 조용·얕음</text>
    <text x="70" y="-150" font-size="15" font-weight="800" fill="#9a7420" text-anchor="middle">주의</text>
    <text x="176" y="-95" font-size="17" font-weight="800" fill="#C4562B" text-anchor="middle">위험</text>
    <text x="176" y="-72" font-size="13.5" fill="#C4562B" text-anchor="middle">입 벌림 동반 시</text>
    <text x="176" y="-54" font-size="13.5" font-weight="800" fill="#C4562B" text-anchor="middle">바로 병원</text>

    <!-- 바늘: 평소값 예시(약 24회, 각도 = 180 - 24/60*180 = 108°) -->
    <line x1="0" y1="0" x2="-74.2" y2="-228.2" stroke="#33302B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#33302B"/>
    <text x="0" y="44" font-size="15" fill="#5b554d" text-anchor="middle">바늘 = 우리 아이 평소 값(예시)</text>
  </g>

  <!-- 우측: 세는 법 -->
  <text x="712" y="176" font-size="19" font-weight="800" fill="#33302B">세는 법</text>
  <g>
    <circle cx="726" cy="220" r="14" fill="#E8825A"/>
    <text x="726" y="225" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="752" y="216" font-size="15.5" fill="#33302B" font-weight="700">잘 때·쉴 때 잰다</text>
    <text x="752" y="238" font-size="14" fill="#8A8378">활동 직후는 높게 나온다</text>

    <circle cx="726" cy="286" r="14" fill="#E8825A"/>
    <text x="726" y="291" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="752" y="282" font-size="15.5" fill="#33302B" font-weight="700">가슴 오르내림 1회 = 한 번</text>
    <text x="752" y="304" font-size="14" fill="#8A8378">들숨+날숨을 한 번으로</text>

    <circle cx="726" cy="352" r="14" fill="#E8825A"/>
    <text x="726" y="357" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="752" y="348" font-size="15.5" fill="#33302B" font-weight="700">15초 세고 ×4</text>
    <text x="752" y="370" font-size="14" fill="#8A8378">평소 값을 알아두면 기준선</text>
  </g>

  <!-- 하단 강조 박스 -->
  <rect x="56" y="470" width="888" height="96" rx="12" fill="#FDEDE4" stroke="#E8825A" stroke-width="1.5"/>
  <text x="80" y="508" font-size="17" font-weight="800" fill="#C4562B">숫자 하나로 안심하지 않습니다</text>
  <text x="80" y="536" font-size="15.5" fill="#5b554d">정상 범위는 개체·상황에 따라 다릅니다. 절대값보다 <tspan font-weight="800" fill="#C4562B">평소보다 뚜렷이 늘었는가</tspan>가 중요하고,</text>
  <text x="80" y="558" font-size="15.5" fill="#5b554d">입을 벌리거나 배로 짜내는 호흡이면 숫자와 무관하게 응급입니다.</text>

  <text x="56" y="606" font-size="14.5" fill="#8A8378">※ 눈금은 이해를 돕는 예시입니다. 진단이 아니며, 이상하면 수의사에게 문의하세요.</text>
</svg>
