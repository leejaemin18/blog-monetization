# 블로그 수익화 프로젝트 설정 (제휴마케팅 중심)
# 이 프로젝트의 핵심은 세컨/서드 블로그 + 네이버 블로그 제휴 수익화입니다.
# ID/PW/API 키는 절대 여기 적지 마세요 (.gitignore 참고).

project:
  start_date: "2026-07-31"     # 프로젝트 시작일 (KST)
  owner: ""                    # 운영자 표시 이름 (선택)

# 예산: 수익 0원인 달에도 감당 가능한지 확인 (docs/01-사전준비-비용.md)
budget:
  domain_won_per_year: 25000   # 도메인 이미 보유 시 0
  server_won_per_month: 31900
  extra_blog_won_per_month: 4000   # 서버당 최대 3개 (세컨/서드 블로그용)
  keyword_tool_won_per_month: 0
  monthly_fixed_total_won: 35900
  can_sustain_6_months: false      # 6개월 고정비 감당 가능하면 true

# ── 참고 전용 ─────────────────────────────────────────────
# 애드센스 기반 블로그(1~3강)는 별도 프로젝트에서 관리. 여기서는 상태만 참조.
adsense_blog_reference:
  managed_in: "제이통관블로그 워드프레스 프로젝트"
  domain: ""                   # 알고 있으면 기록 (참고용)
  adsense_status: "심사중"      # 미시작/심사중/승인/거절
  note: "이 저장소에서는 개설·세팅 방법만 참고(docs/10). 실제 운영은 다른 프로젝트."

# ── 이 프로젝트의 핵심: 제휴 수익화 블로그 ────────────────
# 세컨 블로그 (워드프레스, 서브도메인 활용 가능)
second_blog:
  platform: "wordpress"
  domain: ""                   # 예: home.wp-blog.co.kr (서브도메인)
  is_subdomain: true
  theme: "생활·계절가전 리뷰"   # 확정 (2026-08-01): 쿠팡 파트너스 중심, 객단가↑·사계절 글감
  categories:                  # 4개 카테고리 구조
    - 주방가전
    - 청소·생활가전
    - 계절가전            # 제습·가습·냉난방
    - 구매가이드·비교
  created_at: ""
  programs:
    - 쿠팡 파트너스
    - 네이버 쇼핑 커넥트
  search_engines_registered:
    naver: false
    google: false
    bing: false
    daum: false

# 서드 블로그 (선택, 다른 니치로 확장. 세컨이 궤도에 오른 뒤)
third_blog:
  platform: "wordpress"
  domain: ""                   # 예: review.wp-blog.co.kr
  is_subdomain: true
  theme: ""
  categories: []
  created_at: ""
  programs: []
  search_engines_registered:
    naver: false
    google: false
    bing: false
    daum: false

# 네이버 블로그 (무료. 제휴링크 + 애드포스트 수익화)
naver_blog:
  url: ""                      # 예: https://blog.naver.com/내아이디
  monetization: []             # 예: [제휴링크, 애드포스트]
  adpost_joined: false         # 네이버 애드포스트 가입 여부
  created_at: ""
  note: "쿠팡 등 제휴링크는 반드시 미디어 등록 + 광고표시. 애드포스트는 별개 승인."

# 사용할 제휴 프로그램 (상세는 data/offers.csv)
affiliate_programs:
  - name: "쿠팡 파트너스"
    joined: false
    media_registered: false    # 홍보 채널(세컨/서드/네이버블로그) 미디어 등록 완료 여부
  - name: "네이버 쇼핑 커넥트"
    joined: false
  - name: "Trip.com Partners"
    joined: false

# 외부 유입/홍보 채널 (반드시 미디어로 등록 + 정책 준수)
external_channels:
  naver_cafe: ""
  threads: ""
  youtube: ""

# 목표 (남의 수익 인증이 아니라 본인 기준)
goals:
  first_affiliate_post_by: ""
  monthly_revenue_target_won: 0
